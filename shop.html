    <section class="cq-shop-section">
      <div class="cq-shop-section-head"><h2>Succès</h2><span id="shop-badges-count">0/0</span></div>

    <section class="cq-shop-section">

      <h3>Comment débloquer des pièces ?</h3>
      <p>Gagne des pièces d'or avec les problèmes, le défi quotidien, l'entraîneur, les analyses et les ouvertures maîtrisées.</p>
    </div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
<script src="assets/js/progress.js?v=105"></script>
<script src="assets/js/animations.js"></script>

<script>
const TILE_COLORS=['linear-gradient(160deg,#ff9a4a,#e0472c)','linear-gradient(160deg,#e87d7d,#c23e3e)','linear-gradient(160deg,#9fce62,#547a2a)','linear-gradient(160deg,#4a9fd8,#2a6a9e)','linear-gradient(160deg,#e8b93f,#a97918)','linear-gradient(160deg,#b98ae0,#6b4a9e)'];
function tileBg(item,index){
  if(item.colors && item.colors.length) return `linear-gradient(160deg,${item.colors[0]},${item.colors[1]})`;
  return TILE_COLORS[index % TILE_COLORS.length];
}
function shopTile(item,index){
  const owned = ownsStoreItem(item.id);
  const equipped = item.type === 'board'
    ? ensureEconomy().equippedBoard === item.id
    : item.type === 'pieces' ? ensureEconomy().equippedPieces === item.id
    : item.type === 'background' && ensureEconomy().equippedBackground === item.id;
  return `<button class="cq-shop-tile ${equipped?'equipped':''}" data-item="${item.id}" type="button">
    <span class="ic" style="background:${tileBg(item,index)}">${item.icon||'♟'}</span>
    ${!owned ? `<span class="price-pill">🪙 ${item.price}</span>` : ''}
    <span class="nm">${escapeHtml(item.name)}</span>
  </button>`;
}
function shopSecretRow(item){
  const owned = ownsStoreItem(item.id);
  return `<button class="cq-secret-row ${owned?'owned':''}" data-item="${item.id}" type="button">
    <span class="ic">${item.icon||'🗝️'}</span>
    <span class="nm">${escapeHtml(item.name)}</span>
    <span class="price">${owned?'Explorer ›':`🪙 ${item.price}`}</span>
  </button>`;
}
function handleShopClick(id){
  const item = QUEST_STORE.find(entry=>entry.id===id);
  if(ownsStoreItem(item.id)){
    if(item.type === 'secret'){ location.href='secret-levels.html'; return; }
    equipStoreItem(item.id);
    if(typeof showToast === 'function') showToast('Équipé', `${item.name} est désormais équipé.`);
    renderShop(); return;
  }
  const result = purchaseStoreItem(item.id);
  if(!result.ok){
    if(typeof showToast === 'function') showToast('Pièces insuffisantes', `Il te manque ${item.price-crownBalance()} pièces.`);
    return;
  }
  if(item.type !== 'secret') equipStoreItem(item.id);
  if(typeof showToast === 'function') showToast('Objet débloqué', `${item.name} est maintenant disponible et équipé.`);
  renderShop();
}
function renderShop(){
  document.getElementById('shop-balance').textContent = `🪙 ${crownBalance()}`;
  document.getElementById('shop-boards').innerHTML = QUEST_STORE.filter(x=>x.type==='board').map(shopTile).join('');
  document.getElementById('shop-pieces').innerHTML = QUEST_STORE.filter(x=>x.type==='pieces').map(shopTile).join('');
  const backgrounds = QUEST_STORE.filter(x=>x.type==='background');
  document.getElementById('shop-backgrounds-wrap').style.display = backgrounds.length ? '' : 'none';
  document.getElementById('shop-backgrounds').innerHTML = backgrounds.map(shopTile).join('');
  document.getElementById('shop-secrets').innerHTML = QUEST_STORE.filter(x=>x.type==='secret').map(shopSecretRow).join('');
  document.querySelectorAll('[data-item]').forEach(el => el.onclick = () => handleShopClick(el.dataset.item));

  if(typeof computeBadges === 'function'){
    const badges = computeBadges();
    const unlocked = badges.filter(b=>b.unlocked);
    const badgeIcon = {medal:'🏅',trophy:'🏆',chart:'📈',target:'🎯',puzzle:'🧩',flame:'🔥',star:'⭐'};
    document.getElementById('shop-badges-count').textContent = `${unlocked.length}/${badges.length}`;
    document.getElementById('shop-badges').innerHTML = (unlocked.length ? unlocked : badges.slice(0,4)).map((badge,i)=>`
      <div class="cq-shop-tile" style="cursor:default;">
        <span class="ic" style="background:${TILE_COLORS[i%TILE_COLORS.length]}; ${badge.unlocked?'':'opacity:.35;'}">${badgeIcon[badge.icon]||'🏅'}</span>
        <span class="nm">${escapeHtml(badge.name)}</span>
      </div>`).join('');
  }
}
renderShop();
</script>
