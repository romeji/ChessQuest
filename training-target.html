<body data-page="play" class="training-target-page">

  <section class="page">

<script>
const THEME_ICONS = {
  'Mats de base': '<path d="M12 2 9 9H4l4 3-1.5 7L12 15l5.5 4-1.5-7 4-3h-5z"/>',
  'Mat en 1': '<path d="M12 2 9 9H4l4 3-1.5 7L12 15l5.5 4-1.5-7 4-3h-5z"/>',
  'Fourchette': '<path d="M8 3v7a4 4 0 0 0 8 0V3M12 10v11M9 21h6"/>',
  'Mat du couloir': '<path d="M4 21V9l4-4h8l4 4v12"/><path d="M9 21v-6h6v6"/>',
  'Mat à l\u2019échelle': '<path d="M4 21h16M6 21V9m6 12V5m6 16v-8"/>',
  'Enfilade': '<path d="M3 12h18M15 6l6 6-6 6"/>',
  'Mat étouffé': '<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',
  'Attaque à la découverte': '<circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>',
  'Clouage': '<path d="M12 2v20M8 6l8 12M16 6L8 18"/>',
  'Pièce gratuite': '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  'Déviation': '<path d="M4 12h9M13 12l-3-3M13 12l-3 3M13 5h7v14h-7"/>',
  'Mat par promotion': '<path d="M12 2l3 6 6 1-4.5 4.5L17.5 20 12 17l-5.5 3 1-6.5L3 9l6-1 3-6z"/>'
};
const THEME_COLORS = ['ec-red','ec-dark','ec-orange','ec-gold'];
function renderThemePicker(){
  const grid = document.getElementById('theme-picker-grid');
  const quickCards = [
    {source:'random', label:'Problème aléatoire', count: CLASSIC_PUZZLES.length, desc:'Un défi différent à chaque partie'},
    {source:'mistakes', label:'Corriger mes erreurs', count:(PROGRESS.mistakes || []).length, desc:'Revois les erreurs détectées dans tes parties'}
  ];
  const themes = [...new Set(CLASSIC_PUZZLES.map(puzzle => puzzle.theme))];
  const cards = quickCards.concat(themes.map(theme => ({
    source:'random', theme, label:theme,
    count:CLASSIC_PUZZLES.filter(puzzle => puzzle.theme === theme).length,
    desc:`Exercices ciblés : ${theme.toLowerCase()}`
  })));
  grid.innerHTML = cards.map((c, i) => {
    const query = new URLSearchParams({source:c.source});
    if(c.theme) query.set('theme', c.theme);
    const completionKey = c.theme ? `theme:${c.theme}` : `source:${c.source}`;
    const completed = (PROGRESS.completedTargets || []).includes(completionKey);
    return `
    <a class="entrainement-card ${completed?'target-completed':''}" href="puzzles.html?${query.toString()}">
      <div class="ec-icon ${THEME_COLORS[i % THEME_COLORS.length]}">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${i===0 ? '<path d="M12 2 9 9H4l4 3-1.5 7L12 15l5.5 4-1.5-7 4-3h-5z"/>' : '<path d="M4 12h16M12 4v16"/>'}</svg>
      </div>
      <div class="ec-text">
        <div class="ec-title">${escapeHtml(c.label)}</div>
        <div class="ec-desc">${escapeHtml(c.desc)} · ${c.count} puzzle${c.count>1?'s':''}</div>
      </div>
      ${completed?'<span class="target-complete-badge" title="Déjà réussi">✓</span>':'<svg class="ec-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>'}
    </a>`;
  }).join('');
}
renderThemePicker();
</script>
