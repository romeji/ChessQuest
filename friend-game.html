<!doctype html><html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#262522"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icons/chessquest-app-icon.png"><title>ChessQuest — Défi ami</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css"><link rel="stylesheet" href="assets/css/variables.css"><link rel="stylesheet" href="assets/css/reset.css"><link rel="stylesheet" href="assets/css/components.css?v=104"><link rel="stylesheet" href="assets/css/gamification.css?v=44"><link rel="stylesheet" href="assets/css/entrainement.css"><link rel="stylesheet" href="assets/css/navigation.css?v=101"><link rel="stylesheet" href="assets/css/navigation-stability-v101.css"><script src="assets/js/pwa-bootstrap-v101.js"></script><script defer src="assets/js/navigation.js?v=107"></script>
<link rel="stylesheet" href="assets/css/theme-chesscom-dark.css">
</head><body class="final-shell-page training-final-page"><main class="app"><section class="page">
<header class="final-page-title"><a class="subpage-back" href="friends.html" aria-label="Retour">‹</a><h1>Défi ami</h1><span></span></header>
<p id="match-status" class="section-sub">Connexion au défi…</p><div class="training-final-board-wrap"><div class="board-frame"><div class="coord-ranks" id="friend-ranks"></div><div id="friend-board"></div><div class="coord-files" id="friend-files"></div></div></div>
<div class="cq-move-strip-row"><button id="friend-prev" type="button" class="cq-move-strip-nav" aria-label="Coup précédent">‹</button><div class="cq-move-strip" id="friend-move-strip"></div><button id="friend-next" type="button" class="cq-move-strip-nav" aria-label="Coup suivant">›</button></div>
<p class="section-sub" id="friend-turn">En attente d’un ami</p>
<div class="training-final-controls"><button id="friend-draw" type="button">Nulle</button><button id="friend-resign" type="button">Abandonner</button><button id="friend-chat" type="button">💬</button></div>
<div class="friend-chat-panel hidden" id="friend-chat-panel"><div id="friend-messages"></div><form id="friend-message-form"><input id="friend-message" maxlength="160" placeholder="Message ou emoji"><button>Envoyer</button></form></div>
</section></main><nav class="tabbar" aria-label="Navigation principale"></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script><script src="assets/js/progress.js?v=105"></script><script src="assets/js/app.js?v=107"></script><script src="assets/js/board.js"></script>
<script>
const matchId=new URLSearchParams(location.search).get('match');let matchRef,matchData,matchUser,friendBoard,viewPly=null,unsubscribeMatch,unsubscribeMessages;
async function questUserReady(){for(let i=0;i<30&&typeof questCurrentUser!=='function';i++)await new Promise(resolve=>setTimeout(resolve,100));return typeof questCurrentUser==='function'?questCurrentUser():null;}
async function boot(){
  matchUser=await questUserReady();if(!matchUser||!matchId){location.href='friends.html';return;}matchRef=firebase.firestore().collection('matches').doc(matchId);
  const snap=await matchRef.get();if(!snap.exists){document.getElementById('match-status').textContent='Ce défi n’existe plus.';return;}
  const match=snap.data();if(!match.participantIds.includes(matchUser.uid)&&match.participantIds.length<2){const ownerColor=match.ownerColor||'white';await matchRef.update({participantIds:[...match.participantIds,matchUser.uid],status:'active',players:{...match.players,[matchUser.uid]:{name:matchUser.displayName||'Adversaire',photoURL:matchUser.photoURL||'',color:ownerColor==='white'?'black':'white'}},updatedAt:firebase.firestore.FieldValue.serverTimestamp()});}
  friendBoard=Chessboard('friend-board',{position:'start',draggable:true,pieceTheme:PIECE_THEME,showNotation:false,onDragStart:source=>canPlay(source),onDrop:dropMove,onSnapEnd:()=>friendBoard.position(matchData?.fen||'start',false)});
  unsubscribeMatch=matchRef.onSnapshot(doc=>{if(!doc.exists)return;matchData=doc.data();renderMatch();});
  unsubscribeMessages=matchRef.collection('messages').orderBy('createdAt','asc').limit(30).onSnapshot(renderMessages);
}
function myColor(){return matchData?.players?.[matchUser.uid]?.color||'white'}
function chessAt(fen){return fen&&fen!=='start'?new Chess(fen):new Chess();}
function canPlay(source){if(!matchData||matchData.status!=='active'||viewPly!==matchData.moves.length)return false;const game=chessAt(matchData.fen);return game.turn()===(myColor()==='white'?'w':'b')&&game.get(source)?.color===game.turn();}
async function dropMove(from,to){if(!canPlay(from))return'snapback';const game=chessAt(matchData.fen);const move=game.move({from,to,promotion:'q'});if(!move)return'snapback';await matchRef.update({fen:game.fen(),turn:game.turn(),moves:[...(matchData.moves||[]),move.san],updatedAt:firebase.firestore.FieldValue.serverTimestamp()});}
function renderMatch(){const moves=matchData.moves||[];if(viewPly===null)viewPly=moves.length;viewPly=Math.min(viewPly,moves.length);const game=new Chess();moves.slice(0,viewPly).forEach(s=>game.move(s));friendBoard.orientation(myColor());friendBoard.position(viewPly===moves.length?(matchData.fen||'start'):game.fen(),false);renderCoords('friend-ranks','friend-files',myColor()==='white'?'white':'black');renderMoveStrip(document.getElementById('friend-move-strip'),moves,viewPly,jumpFriendMove);const two=matchData.participantIds?.length===2;document.getElementById('friend-turn').textContent=matchData.status==='waiting'?'En attente de ton ami…':matchData.status==='finished'?'Partie terminée':(matchData.turn===(myColor()==='white'?'w':'b')?'À toi de jouer':'Au tour de ton ami');document.getElementById('match-status').textContent=two?'Partie connectée en direct':'Lien créé — attends qu’un ami rejoigne.';}
function jumpFriendMove(ply){viewPly=ply;renderMatch();}
function renderMessages(snap){document.getElementById('friend-messages').innerHTML=snap.docs.map(doc=>`<p><b>${escapeHtml(doc.data().senderName||'Joueur')}</b> ${escapeHtml(doc.data().text||'')}</p>`).join('');}
bindMoveStripNav(document.getElementById('friend-prev'),document.getElementById('friend-next'),()=>viewPly,()=>(matchData?.moves||[]).length,jumpFriendMove);document.getElementById('friend-resign').onclick=()=>matchRef?.update({status:'finished',winnerUid:matchData.participantIds.find(id=>id!==matchUser.uid)||null,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('friend-draw').onclick=()=>{if(!matchRef)return;if(matchData.drawOffer&&matchData.drawOffer!==matchUser.uid){matchRef.update({status:'finished',result:'draw',drawOffer:null,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});}else{matchRef.update({drawOffer:matchUser.uid,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});}};document.getElementById('friend-chat').onclick=()=>document.getElementById('friend-chat-panel').classList.toggle('hidden');document.getElementById('friend-message-form').onsubmit=async event=>{event.preventDefault();const text=document.getElementById('friend-message').value.trim();if(!text||!matchRef)return;await matchRef.collection('messages').add({senderUid:matchUser.uid,senderName:matchUser.displayName||'Joueur',text,createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('friend-message').value=''};window.addEventListener('pagehide',()=>{unsubscribeMatch?.();unsubscribeMessages?.()});boot();
</script></body></html>
