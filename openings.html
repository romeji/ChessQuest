<script>
const OPENING_FACTS = {
  italienne: ['♞|Développement rapide', '◎|Pression sur f7', '▤|Popularisée au XVIe siècle'],
  espagnole: ['♞|Pression durable sur e5', '◎|Une richesse stratégique immense', '▤|Étudiée depuis le XVIe siècle'],
  qgd: ['♞|Centre solide et durable', '◎|Pression sur le pion d5', '▤|Un classique des champions du monde'],
  qga: ['♞|Développement très rapide', '◎|Récupération naturelle du pion', '▤|Un centre libre pour les pièces'],
  slav: ['♞|Structure noire très solide', '◎|Lutte immédiate pour d5', '▤|Une réponse moderne au Gambit Dame'],
  najdorf: ['♞|Jeu dynamique et flexible', '◎|Contre-attaque à l’aile dame', '▤|Popularisée par Miguel Najdorf']
};
function shortOpeningName(line){
  if(!line) return 'Ouverture';
  return line.name.replace(/\s*\([^)]*\)\s*/g,' ').trim();
}
function openingArticle(name){
  if(name.startsWith('Défense')) return `la ${name}`;
  if(name.startsWith('Gambit') || name.startsWith('Système') || name.startsWith('Mat')) return `le ${name}`;
  return `l’${name}`;
}
function frenchSan(san){
  const pieces = {N:'C',B:'F',R:'T',Q:'D',K:'R'};
  return pieces[san.charAt(0)] ? pieces[san.charAt(0)] + san.slice(1) : san;
}
function firstMovesText(){
  if(!currentLine) return '';
  const moves = currentLine.moves.slice(0,4).map(move => frenchSan(move.san));
  const pairs = [];
  for(let i=0;i<moves.length;i+=2) pairs.push(`${Math.floor(i/2)+1}. ${moves[i] || ''} ${moves[i+1] || ''}`.trim());
  return pairs.join('   ');
}
function renderTheory(){
  if(!currentLine) return;
  const name = shortOpeningName(currentLine);
  document.getElementById('line-name').textContent = name;
  document.getElementById('theory-title').textContent = `Pourquoi jouer ${openingArticle(name)} ?`;
  const facts = OPENING_FACTS[currentLineKey] || [
    `♞|${currentLine.intro.split('.')[0]}`,
    '◎|Comprendre le centre et le développement',
    '▤|Une structure à mémoriser progressivement'
  ];
  document.getElementById('opening-facts').innerHTML = facts.map(fact => {
    const [icon,label] = fact.split('|');
    return `<span class="opening-final-fact"><i>${icon}</i>${escapeHtml(label)}</span>`;
  }).join('');
  const about = currentLine.about || currentLine.intro || `${name} aide à développer les pièces avec un plan clair.`;
  const plan = currentLine.plan || 'Contrôle le centre, développe les pièces mineures et mets rapidement ton roi en sécurité.';
  document.getElementById('opening-history-copy').innerHTML = `<h3>Histoire et idée générale</h3><p>${escapeHtml(about)}</p><h3>Le plan à retenir</h3><p>${escapeHtml(plan)}</p><h3>À surveiller</h3><p>Ne récite pas seulement les coups : vérifie les menaces, les cases faibles et le moment où la position quitte la théorie.</p>`;
  document.getElementById('opening-memory-sequence').textContent = firstMovesText();
}
function renderDots(){
  if(!currentLine) return;
  const total = currentLine.moves.length;
  const step = Math.min(total,trainPly);
  document.getElementById('lesson-progress-label').textContent = `${step} / ${total} coups`;
  document.getElementById('lesson-track-fill').style.width = `${Math.round((trainPly / currentLine.moves.length) * 100)}%`;
  const lineComplete = trainPly >= currentLine.moves.length;
  document.querySelector('.opening-next-label').textContent = lineComplete ? 'Ouverture suivante' : 'Indice';
  document.getElementById('opening-next').textContent = lineComplete ? 'Ouverture suivante' : 'Afficher un indice';
  document.getElementById('opening-next').setAttribute('aria-label',lineComplete ? 'Continuer vers la prochaine ouverture' : 'Afficher le prochain coup');
  renderTheory();
}
function renderTrainMoveList(){
  renderTheory();
}

const params = new URLSearchParams(location.search);
const GAMBIT_DAME_STEPS = ['qgd','qga','slav'];
const gambitDameCurriculum = params.get('path') === 'gambit_dame';
const requested = params.get('opening');
const requestedWorld = params.get('world');
const requestedIsland = params.get('island');
const firstGambitStep = GAMBIT_DAME_STEPS.find(key => !PROGRESS.mastered[key]) || GAMBIT_DAME_STEPS[0];
const startKey = gambitDameCurriculum
  ? ((requested && GAMBIT_DAME_STEPS.includes(requested)) ? requested : firstGambitStep)
  : ((requested && OPENINGS[requested]) ? requested : 'italienne');
const startLocation = findCurriculumLesson(startKey);
const backWorld = requestedWorld || (startLocation && startLocation.world.id) || 'fondations';
const backIsland = requestedIsland || (startLocation && startLocation.island.id) || '';
document.getElementById('opening-back').href = `learn.html?world=${encodeURIComponent(backWorld)}${backIsland ? `&island=${encodeURIComponent(backIsland)}` : ''}`;
const theoryModal=document.getElementById('opening-theory-modal');
document.getElementById('opening-theory-button').onclick=()=>theoryModal.classList.remove('hidden');
document.getElementById('opening-theory-close').onclick=()=>theoryModal.classList.add('hidden');
theoryModal.onclick=event=>{if(event.target===theoryModal)theoryModal.classList.add('hidden');};
localStorage.setItem('cq-opening-last',JSON.stringify({key:startKey,world:backWorld,island:backIsland}));

function nextCurriculumUrl(key){
  const locationData = findCurriculumLesson(key);
  if(!locationData) return 'learn.html';
  const {world,island,worldIndex,islandIndex,lessonIndex} = locationData;
  if(lessonIndex + 1 < island.lessons.length){
    const nextKey = island.lessons[lessonIndex + 1];
    return `openings.html?opening=${encodeURIComponent(nextKey)}&world=${encodeURIComponent(world.id)}&island=${encodeURIComponent(island.id)}`;
  }
  if(islandIndex + 1 < world.islands.length){
    return `learn.html?world=${encodeURIComponent(world.id)}&island=${encodeURIComponent(world.islands[islandIndex + 1].id)}`;
  }
  if(worldIndex + 1 < OPENING_WORLDS.length){
    const nextWorld = OPENING_WORLDS[worldIndex + 1];
    return `learn.html?world=${encodeURIComponent(nextWorld.id)}&island=${encodeURIComponent(nextWorld.islands[0].id)}`;
  }
  return `learn.html?world=${encodeURIComponent(world.id)}`;
}

document.getElementById('opening-copy').onclick = async function(){
  const text = firstMovesText();
  try{ await navigator.clipboard.writeText(text); }catch(error){}
  showToast('Coups copiés', text);
};
document.getElementById('opening-next').onclick = function(){
  if(!currentLine) return;
  if(trainPly >= currentLine.moves.length){
    location.href = nextCurriculumUrl(currentLineKey);
    return;
  }
  const expected = currentLine.moves[trainPly];
  const g = new Chess(trainGame.fen());
  const move = g.moves({verbose:true}).find(item => item.san === expected.san.replace(/[!?]+$/,''));
  if(move) flashSquares('#train-board',[move.from,move.to],'hint-square',1200);
};
ensureTrainBoard();
loadLine(OPENINGS[startKey],startKey);
watchBoardResize('train-board',() => trainBoard,'.opening-final-board-wrap');
</script>
