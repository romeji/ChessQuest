<link rel="icon" href="assets/icons/chessquest-app-icon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/chessquest-app-icon.png">
<title>ChessQuest — Partie d’entraînement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/layout.css">

<link rel="stylesheet" href="assets/css/polish.css">

<body data-page="play" class="final-shell-page training-final-page">
<div id="toast-container"></div>
<main class="app">
  <section class="page">
    <header class="final-page-title">
      <a class="subpage-back" href="entrainement.html" aria-label="Retour à l’entraînement">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <h1>Partie d’entraînement</h1>
      <a class="final-icon-button training-final-settings" href="settings.html" aria-label="Paramètres">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
      </a>
    </header>

    <label class="bot-final-elo" for="bot-elo-select">
      <select id="bot-elo-select" aria-label="Niveau ELO du bot"></select>
    </label>

    <div class="training-final-board-wrap">
      <div class="board-frame">
        <div class="coord-ranks" id="tg-ranks"></div>
        <div id="tg-board"></div>
        <div class="coord-files" id="tg-files"></div>
      </div>
    </div>

    <section class="final-card training-final-history" aria-label="Historique des coups">
      <h2>Historique des coups</h2>
      <div class="training-move-log" id="tg-move-log" aria-live="polite"></div>
    </section>

    <aside class="training-final-coach">
      <img id="training-mascot" data-mascot-image src="assets/illustrations/mascot-coach-encourage.webp" alt="Coach ChessQuest">
      <p class="training-final-tip" data-mascot-text id="training-tip-text">Solide. Pas tout à fait du génie, mais je valide.</p>
    </aside>

    <div class="training-final-controls">
      <button id="resign-btn" type="button">⚑&nbsp; Abandonner</button>
      <button class="training-advice" id="hint-btn2" type="button">Conseil</button>
    </div>

    <div class="training-final-hidden" aria-hidden="true">
      <span id="bot-difficulty-label">1200 ELO</span>
      <span id="bot-status">Ta partie contre l’ordinateur</span>
      <div id="coach-bubble" class="hidden"><span id="coach-icon">👍</span><span id="coach-text"></span></div>
      <button id="undo-btn" type="button">Retour</button>
      <button id="next-btn" type="button" disabled>Suivant</button>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
<script src="assets/js/progress.js"></script>
<script src="assets/js/chesscom.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/mascot-coach.js?v=44"></script>
<script src="assets/js/navigation.js"></script>
<script src="assets/js/board.js"></script>
<script src="assets/js/training.js"></script>
</body>
</html>
