<body data-page="play" class="final-shell-page training-final-page">
<div id="toast-container"></div>
<main class="app">
  <section class="page">
    <header class="final-page-title">
      <a class="subpage-back" href="index.html" aria-label="Retour à l’accueil">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <h1>Partie d’entraînement</h1>
      <span class="final-title-spacer" aria-hidden="true"></span>
    </header>

    <label class="bot-final-elo" for="bot-elo-select">
      <select id="bot-elo-select" aria-label="Niveau ELO du bot"></select>
    </label>

    <aside class="training-final-coach">
      <img id="training-mascot" data-mascot-image src="assets/illustrations/mascot-coach-encourage.webp" alt="Coach ChessQuest">
      <p class="training-final-tip" data-mascot-text id="training-tip-text">Je regarde. Essaie de ne pas faire honte au royaume.</p>
    </aside>

    <div class="training-final-board-wrap">
      <div class="board-frame">
        <div class="coord-ranks" id="tg-ranks"></div>
        <div id="tg-board"></div>
        <div class="coord-files" id="tg-files"></div>
      </div>
    </div>

    <div class="training-move-browser" aria-label="Navigation dans les coups">
      <button id="tg-history-prev" type="button" aria-label="Coup précédent">‹</button>
      <span><strong id="tg-history-current">Position initiale</strong><small id="tg-history-position">À toi de jouer</small></span>
      <button id="tg-history-next" type="button" aria-label="Coup suivant">›</button>
    </div>

    <div class="training-final-controls">
      <button id="undo-btn" type="button">↶&nbsp; Revenir</button>
      <button id="resign-btn" type="button">⚑&nbsp; Abandonner</button>
      <button class="training-advice" id="hint-btn2" type="button">Conseil</button>
    </div>

    <div class="training-final-hidden" aria-hidden="true">
      <span id="bot-difficulty-label">1200 ELO</span>
      <span id="bot-status">Ta partie contre l’ordinateur</span>
      <div id="coach-bubble" class="hidden"><span id="coach-icon">👍</span><span id="coach-text"></span></div>
      <button id="next-btn" type="button" disabled>Suivant</button>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

<script src="assets/js/board.js"></script>
<script src="assets/js/training.js?v=108"></script>
</body>
</html>
