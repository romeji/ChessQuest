<script>
function profileRank(rating){
  if(rating >= 2000) return 'Maître';
  if(rating >= 1600) return 'Stratège';
  if(rating >= 1300) return 'Tacticien';
  if(rating >= 1000) return 'Chevalier';
  return 'Apprenti';
}

function objectiveRow(icon,title,current,target,color,reward){
  const progress = Math.min(100,Math.round((current / target) * 100));
  return `<div class="profile-objective">
    <span class="profile-row-icon">${icon}</span>
    <span class="profile-objective-copy">
      <strong>${title}</strong>
      <span class="mini-track"><i style="width:${progress}%;background:${color}"></i></span>
    </span>
    <span class="profile-objective-meta">${Math.min(current,target)}/${target}&nbsp;&nbsp; ${QUEST_CURRENCY.icon} ${reward}</span>
  </div>`;
}

function achievementRow(icon,title,subtitle,date){
  return `<div class="profile-achievement">
    <span class="profile-row-icon">${icon}</span>
    <span class="profile-achievement-copy"><strong>${title}</strong><small>${subtitle}</small></span>
    <span class="profile-objective-meta">${date}</span>
  </div>`;
}

function renderProfile(){
  ensureDailyProgressFresh();
  const state = chessComState();
  const username = state.username || PROGRESS.settings?.chessComUsername || 'Alex';
  const games = state.games || [];
  const lower = username.toLowerCase();
  const ratings = games.map(game => {
    const white = game.white?.username?.toLowerCase() === lower;
    return Number(white ? game.white?.rating : game.black?.rating);
  }).filter(Number.isFinite);
  const statCurrent = Number(state.stats?.chess_rapid?.last?.rating);
  const statBest = Number(state.stats?.chess_rapid?.best?.rating);
  const current = Number.isFinite(statCurrent) ? statCurrent : (ratings[0] || 1200);
  const best = Number.isFinite(statBest) ? statBest : (ratings.length ? Math.max(...ratings) : current);
  const wins = games.filter(game => {
    const white = game.white?.username?.toLowerCase() === lower;
    return (white ? game.white?.result : game.black?.result) === 'win';
  }).length;
  const winrate = games.length ? Math.round((wins / games.length) * 100) : 0;
  const mastered = Object.keys(PROGRESS.mastered || {}).length;
  const badges = computeBadges().filter(badge => badge.unlocked).length;
  document.getElementById('profile-gem-count').textContent = crownBalance();
  document.getElementById('profile-name').textContent = username;
  document.getElementById('profile-elo').textContent = current;
  document.getElementById('profile-rank').textContent = profileRank(current);
  document.getElementById('profile-games').textContent = games.length;
  document.getElementById('profile-winrate').textContent = `${winrate}%`;
  document.getElementById('profile-best-elo').textContent = best;
  document.getElementById('profile-extra-badges').textContent = `+${Math.max(0,badges - 5)}`;
  const daily = PROGRESS.dailyProgress;
  document.getElementById('profile-objectives').innerHTML = [
    objectiveRow('♟','Résoudre 3 problèmes',daily.puzzlesSolvedToday || 0,3,'#7337a3',QUEST_REWARDS.daily),
    objectiveRow('♞','Jouer 1 partie',daily.gamesPlayedToday || 0,1,'#4c9c5a',DAILY_BONUS_GOALS.gamesPlayedToday.crowns),
    objectiveRow('◉','Analyser 1 partie',daily.gamesAnalyzedToday || 0,1,'#27645b',DAILY_BONUS_GOALS.gamesAnalyzedToday.crowns)
  ].join('');
  const today = new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});
  document.getElementById('profile-achievements').innerHTML = [
    achievementRow('🏆','Maître des ouvertures',`${mastered} ouverture${mastered > 1 ? 's' : ''} maîtrisée${mastered > 1 ? 's' : ''}`,today),
    achievementRow('🔥',`Série de ${computeCurrentStreak()} jours`,'Continue ta régularité',today),
    achievementRow('♛','Tacticien accompli',`${PROGRESS.puzzlesSolved || 0} problèmes résolus`,today)
  ].join('');
  const analyses=PROGRESS.games||[];
  const accuracies=analyses.flatMap(game=>[Number(game.whiteAcc),Number(game.blackAcc)]).filter(Number.isFinite);
  const accuracy=accuracies.length?Math.round(accuracies.reduce((sum,value)=>sum+value,0)/accuracies.length):0;
  const pending=Math.max(0,(PROGRESS.mistakes||[]).length-(PROGRESS.solvedMistakeIds||[]).length);
  const openingScore=Math.min(100,Math.round(mastered/12*100));
  const tacticalScore=Math.min(100,Math.round((PROGRESS.puzzlesSolved||0)/50*100));
  const regularityScore=Math.min(100,computeCurrentStreak()*12);
  const diagnostics=[['Tactique',tacticalScore],['Ouvertures',openingScore],['Précision',accuracy],['Régularité',regularityScore]];
  document.getElementById('profile-diagnostic').innerHTML=diagnostics.map(([label,value])=>`<div><span>${label}</span><i><b style="width:${value}%"></b></i><strong>${value}%</strong></div>`).join('')+`<a href="${pending?'puzzles.html?source=mistakes':'analysis.html'}">${pending?`${pending} erreur${pending>1?'s':''} à corriger`:'Analyse une nouvelle partie pour obtenir un plan personnalisé'} →</a>`;
  const records=PROGRESS.puzzleBattleScores||{30:[],45:[],60:[]};
  document.getElementById('battle-records').innerHTML=[30,45,60].map(duration=>`<div><span>${duration} s</span><strong>${records[duration]?.[0]?.score||0}</strong><small>problèmes</small></div>`).join('');
}

async function initProfile(){
  renderProfile();
  const username = chessComState().username || PROGRESS.settings?.chessComUsername || '';
  if(!username) return;
  try{
    await fetchChessComStats(username);
    await syncChessCom(username);
    renderProfile();
  }catch(error){
    console.warn(error);
  }
}

initProfile();
</script>
