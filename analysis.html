<body data-page="analyze" class="quest-screen analysis-page">

  <section class="page">

    <section class="analysis-hero">

        <p id="analysis-quest-copy">Synchronise tes parties récentes, puis découvre les moments clés et les erreurs à corriger.</p>

      <div class="analysis-eval">
        <svg id="analysis-eval-svg" viewBox="0 0 280 92" preserveAspectRatio="none" aria-label="Courbe d'évaluation"></svg>

<script>
let fetchedGames = [];

function resultMeta(game,isWhite){
  const mine = isWhite ? game.white : game.black;
  const theirs = isWhite ? game.black : game.white;
  const mineResult = mine?.result || '';
  const theirResult = theirs?.result || '';
  const drawCodes = ['agreed','repetition','stalemate','insufficient','50move','timevsinsufficient'];
  if(mineResult === 'win') return {score:'1–0',label:'Bon coup',cls:'ready'};
  if(drawCodes.includes(mineResult) || drawCodes.includes(theirResult)) return {score:'½–½',label:'Imprécis',cls:'pending'};
  return {score:'0–1',label:'À revoir',cls:'pending'};
}

function renderEvaluation(games,username){
  const svg = document.getElementById('analysis-eval-svg');
  const score = document.getElementById('analysis-eval-score');
  const values = (games || []).slice(0,12).reverse().map(game => {
    const isWhite = game.white?.username?.toLowerCase() === username.toLowerCase();
    return Number(isWhite ? game.white?.rating : game.black?.rating);
  }).filter(Number.isFinite);
  if(values.length < 2){
    svg.innerHTML = '<path d="M0 47H280" stroke="#d8cfbd" stroke-width="1"/>';
    score.innerHTML = '—<small>Joue ou synchronise une partie</small>';
    return;
  }
  const min = Math.min(...values), max = Math.max(...values), range = Math.max(1,max - min);
  const points = values.map((value,index) => [
    4 + index * (272 / (values.length - 1)),
    82 - ((value - min) / range) * 66
  ]);
  const line = points.map((point,index) => `${index ? 'L' : 'M'}${point[0].toFixed(1)},${point[1].toFixed(1)}`).join(' ');
  const area = `${line} L${points.at(-1)[0]},88 L${points[0][0]},88 Z`;
  const delta = values.at(-1) - values[0];
  svg.innerHTML = `
    <defs><linearGradient id="analysisFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3f9a50" stop-opacity=".72"/><stop offset="1" stop-color="#3f9a50" stop-opacity=".08"/></linearGradient></defs>
    <path d="M0 46H280" stroke="#d8cfbd" stroke-width="1"/>
    <path d="${area}" fill="url(#analysisFill)"/>
    <path d="${line}" fill="none" stroke="#176c38" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  score.innerHTML = `${delta >= 0 ? '+' : ''}${delta}<small>${delta >= 0 ? 'Avantage en progression' : 'Points à reconquérir'}</small>`;
}

function renderGamesList(games,username){
  fetchedGames = games || [];
  const list = document.getElementById('games-list');
  const latest = fetchedGames[0];
  document.getElementById('analysis-gem-count').textContent = crownBalance();
  if(latest){
    const isWhite = latest.white?.username?.toLowerCase() === username.toLowerCase();
    const opponent = isWhite ? latest.black?.username : latest.white?.username;
    document.getElementById('analysis-quest-title').textContent = 'Ta dernière partie est prête à analyser';
    document.getElementById('analysis-quest-copy').textContent = `${opponent || 'Adversaire'} · ${latest.time_class || 'Partie'} · ouvre l’analyse sans la retélécharger.`;
    document.getElementById('analysis-quest-btn').onclick = () => openGame(0);
  }else{
    document.getElementById('analysis-quest-btn').textContent = 'Connecter Chess.com';
    document.getElementById('analysis-quest-btn').onclick = () => { location.href = 'settings.html'; };
  }
  if(!fetchedGames.length){
    list.innerHTML = '<p class="section-sub" style="margin:4px 0">Aucune partie en cache. Ajoute ton pseudo Chess.com dans les réglages.</p>';
    renderEvaluation([],username);
    return;
  }
  list.innerHTML = fetchedGames.slice(0,5).map((game,index) => {
    const isWhite = game.white?.username?.toLowerCase() === username.toLowerCase();
    const opponent = isWhite ? game.black : game.white;
    const meta = resultMeta(game,isWhite);
    const date = game.end_time ? new Date(game.end_time * 1000).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}) : '';
    return `<button class="game-row" data-idx="${index}" type="button">
      <span class="g-player">
        <span class="g-avatar">♞</span>
        <span><span class="g-name">${escapeHtml(opponent?.username || 'Adversaire')}</span><span class="g-rating">${opponent?.rating || '—'} · ${date}</span></span>
      </span>
      <span class="g-score">${meta.score}</span>
      <span class="g-status ${meta.cls}" data-status-idx="${index}">${meta.label}</span>
    </button>`;
  }).join('');
  list.querySelectorAll('.game-row').forEach(row => {
    row.onclick = () => openGame(Number(row.dataset.idx));
  });
  renderEvaluation(fetchedGames,username);
  refreshStatuses(fetchedGames);
}

async function refreshStatuses(games){
  await Promise.all(games.slice(0,5).map(async (game,index) => {
    const badge = document.querySelector(`[data-status-idx="${index}"]`);
    if(!badge || !game.url) return;
    const precomputed = await fetchPrecomputedAnalysis(game.url);
    if(precomputed?.results?.length){
      badge.textContent = 'Analyse prête';
      badge.className = 'g-status ready';
    }
  }));
}

function openGame(index){
  const game = fetchedGames[index];
  if(!game) return;
  sessionStorage.setItem('cq_selected_game',JSON.stringify(game));
  location.href = 'game-view.html';
}

function refreshChessComUI(){
  const state = chessComState();
  const username = state.username || PROGRESS.settings?.chessComUsername || '';
  renderGamesList((state.games || []).slice(0,10),username);
}

async function initGamesList(){
  refreshChessComUI();
  const username = chessComState().username || PROGRESS.settings?.chessComUsername || '';
  if(!username) return;
  try{
    await syncChessCom(username);
    refreshChessComUI();
  }catch(error){
    console.warn(error);
  }
}

initGamesList();
</script>
