<script>
let fetchedGames = [];

function resultMeta(game,isWhite){
  const mine = isWhite ? game.white : game.black;
  const theirs = isWhite ? game.black : game.white;
  const mineResult = mine?.result || '';
  const theirResult = theirs?.result || '';
  const drawCodes = ['agreed','repetition','stalemate','insufficient','50move','timevsinsufficient'];
  if(mineResult === 'win') return {score:'1–0',label:'Bon coup',cls:'ready'};
  if(drawCodes.includes(mineResult) || drawCodes.includes(theirResult)) return {score:'½–½',label:'Imprécis',cls:'pending'};
  return {score:'0–1',label:'À revoir',cls:'pending'};
}

function renderEvaluation(games,username){
  const svg = document.getElementById('analysis-eval-svg');
  const score = document.getElementById('analysis-eval-score');
  const values = (games || []).slice(0,12).reverse().map(game => {
    const isWhite = game.white?.username?.toLowerCase() === username.toLowerCase();
    return Number(isWhite ? game.white?.rating : game.black?.rating);
  }).filter(Number.isFinite);
  if(values.length < 2){
    svg.innerHTML = '<path d="M0 47H280" stroke="#d8cfbd" stroke-width="1"/>';
    score.innerHTML = '—<small>Joue ou synchronise une partie</small>';
    return;
  }
  const min = Math.min(...values), max = Math.max(...values), range = Math.max(1,max - min);
  const points = values.map((value,index) => [
    4 + index * (272 / (values.length - 1)),
    82 - ((value - min) / range) * 66
  ]);
  const line = points.map((point,index) => `${index ? 'L' : 'M'}${point[0].toFixed(1)},${point[1].toFixed(1)}`).join(' ');
  const area = `${line} L${points.at(-1)[0]},88 L${points[0][0]},88 Z`;
  const delta = values.at(-1) - values[0];
  svg.innerHTML = `
    <defs><linearGradient id="analysisFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3f9a50" stop-opacity=".72"/><stop offset="1" stop-color="#3f9a50" stop-opacity=".08"/></linearGradient></defs>
    <path d="M0 46H280" stroke="#d8cfbd" stroke-width="1"/>
    <path d="${area}" fill="url(#analysisFill)"/>
    <path d="${line}" fill="none" stroke="#176c38" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  score.innerHTML = `${delta >= 0 ? '+' : ''}${delta}<small>${delta >= 0 ? 'Avantage en progression' : 'Points à reconquérir'}</small>`;
}

function renderGamesList(games,username){
  fetchedGames = games || [];
  const lastBox = document.getElementById('analysis-last-game');
  const list = document.getElementById('games-list');
  const latest = fetchedGames[0];
  document.getElementById('analysis-gem-count').textContent = crownBalance();

  if(latest){
    const isWhite = latest.white?.username?.toLowerCase() === username.toLowerCase();
    const opponent = (isWhite ? latest.black?.username : latest.white?.username) || 'Adversaire';
    const opponentRating = (isWhite ? latest.black?.rating : latest.white?.rating) || '—';
    const meta = resultMeta(latest,isWhite);
    document.getElementById('analysis-last-title').textContent = `Ta dernière partie contre ${opponent}`;
    lastBox.innerHTML = `<button class="cq-match-card" type="button" id="analysis-last-game-btn" style="width:100%; border:none; cursor:pointer; text-align:left;">
      <div class="av">⏱</div>
      <div class="body">
        <div class="name">${escapeHtml(opponent)} (${opponentRating})</div>
        <div class="sub">${latest.time_class || 'Partie'} · ${meta.label}</div>
      </div>
      ${meta.score === '1–0' ? '<div class="go">+</div>' : meta.score === '0–1' ? '<div class="sub">−</div>' : '<div class="sub">=</div>'}
    </button>`;
    document.getElementById('analysis-last-game-btn').onclick = () => openGame(0);
  } else {
    document.getElementById('analysis-last-title').textContent = 'Ta dernière partie';
    lastBox.innerHTML = `<a class="cq-match-empty" href="settings.html" style="border-style:solid;">
      <div class="ic">♟</div><div><div class="title">Aucune partie synchronisée</div><div class="sub">Ajoute ton pseudo Chess.com dans les réglages</div></div>
    </a>`;
  }

  if(!fetchedGames.length){
    list.innerHTML = '';
    renderEvaluation([],username);
    return;
  }
  list.innerHTML = `<div class="cq-friend-scroll" style="flex-direction:column; overflow:visible;">${fetchedGames.slice(0,8).map((game,index) => {
    const isWhite = game.white?.username?.toLowerCase() === username.toLowerCase();
    const opponent = isWhite ? game.black : game.white;
    const meta = resultMeta(game,isWhite);
    const date = game.end_time ? new Date(game.end_time * 1000).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}) : '';
    return `<button class="cq-match-card" type="button" data-idx="${index}" style="width:100%; border:none; cursor:pointer; text-align:left; margin-bottom:8px;">
      <div class="av">⏱</div>
      <div class="body">
        <div class="name">${escapeHtml(opponent?.username || 'Adversaire')} (${opponent?.rating || '—'})</div>
        <div class="sub">${date} · <span data-status-idx="${index}">${meta.label}</span></div>
      </div>
      ${meta.score === '1–0' ? '<div class="go">+</div>' : meta.score === '0–1' ? '<div class="sub">−</div>' : '<div class="sub">=</div>'}
    </button>`;
  }).join('')}</div>`;
  list.querySelectorAll('[data-idx]').forEach(row => {
    row.onclick = () => openGame(Number(row.dataset.idx));
  });
  renderEvaluation(fetchedGames,username);
  refreshStatuses(fetchedGames);
  renderAnalysisInsights(fetchedGames, username);
}

function renderAnalysisInsights(games, username){
  const card = document.getElementById('analysis-insights-card');
  const box = document.getElementById('analysis-insights');
  if(!games.length){ card.style.display = 'none'; return; }
  const rows = [];
  const withAccuracy = games.filter(game => Number.isFinite(game.accuracies?.white) || Number.isFinite(game.accuracies?.black));
  if(withAccuracy.length){
    const avg = withAccuracy.reduce((sum, game) => {
      const isWhite = game.white?.username?.toLowerCase() === username.toLowerCase();
      const value = isWhite ? game.accuracies?.white : game.accuracies?.black;
      return sum + (Number.isFinite(value) ? value : 0);
    }, 0) / withAccuracy.length;
    rows.push(`<div class="menu-row"><span class="ic">📈</span>Précision moyenne : ${avg.toFixed(1)}% sur les ${withAccuracy.length} dernières parties<span class="arrow">›</span></div>`);
  }
  const losses = games.filter(game => {
    const isWhite = game.white?.username?.toLowerCase() === username.toLowerCase();
    return (isWhite ? game.white?.result : game.black?.result) !== 'win';
  }).length;
  rows.push(`<div class="menu-row"><span class="ic">⚠</span>${losses} défaite${losses>1?'s':''} sur les ${games.length} dernières parties suivies<span class="arrow">›</span></div>`);
  card.style.display = '';
  box.innerHTML = rows.join('');
}

async function refreshStatuses(games){
  await Promise.all(games.slice(0,8).map(async (game,index) => {
    const badge = document.querySelector(`[data-status-idx="${index}"]`);
    if(!badge || !game.url) return;
    const precomputed = await fetchPrecomputedAnalysis(game.url);
    if(precomputed?.results?.length){
      badge.textContent = 'Analyse prête';
    }
  }));
}

function openGame(index){
  const game = fetchedGames[index];
  if(!game) return;
  const serialized = JSON.stringify(game);
  // sessionStorage est parfois vidé par iOS lorsqu'une PWA change de document.
  // localStorage garantit que le bilan pourra toujours restaurer la partie.
  try { sessionStorage.setItem('cq_selected_game', serialized); } catch(e) {}
  try { localStorage.setItem('cq_selected_game', serialized); } catch(e) {}
  location.assign('game-view.html');
}

function refreshChessComUI(){
  const state = chessComState();
  const username = state.username || PROGRESS.settings?.chessComUsername || '';
  renderGamesList((state.games || []).slice(0,10),username);
}

async function initGamesList(){
  refreshChessComUI();
  const username = chessComState().username || PROGRESS.settings?.chessComUsername || '';
  if(!username) return;
  try{
    await syncChessCom(username);
    refreshChessComUI();
  }catch(error){
    console.warn(error);
  }
}

initGamesList();
</script>
