<script type="text/plain" id="legacy-daily-challenge">
let dailyQueue = [];
let dailyIdx = 0;
let dailyBoard = null;
let dailyGame = null;
let dailyLocked = false;

function pickDailyPuzzles(n){
  const seed = dayOfYear();
  return CLASSIC_PUZZLES
    .map((p,i) => ({p, key:((i + 1) * 2654435761 + seed * 40503) % 100000}))
    .sort((a,b) => a.key - b.key)
    .slice(0,Math.min(n,CLASSIC_PUZZLES.length))
    .map(item => item.p);
}

function ensureDailyBoard(){
  if(dailyBoard) return;
  dailyBoard = Chessboard('daily-board',{
    position:'start',
    draggable:true,
    pieceTheme:PIECE_THEME,
    showNotation:false,
    onDragStart:(source)=>{ if(!dailyLocked && dailyGame) showLegalMoveDots('#daily-board',dailyGame,source); },
    onDrop:onDailyBoardDrop,
    onSnapEnd:()=>clearLegalMoveDots('#daily-board')
  });
  renderCoords('daily-ranks','daily-files','white');
  requestAnimationFrame(() => fitBoards('daily-board',dailyBoard,'.daily-board-wrap'));
}

function onDailyBoardDrop(source,target){
  if(dailyLocked || !dailyGame || !dailyQueue[dailyIdx]) return 'snapback';
  const move = dailyGame.moves({verbose:true}).find(candidate => candidate.from === source && candidate.to === target);
  if(!move) return 'snapback';
  const solution = (dailyQueue[dailyIdx].solution || '').replace(/[!?]+$/,'');
  const option = [...document.querySelectorAll('#daily-mcq-options .mcq-option')]
    .find(item => item.dataset.san === move.san);
  onDailyAnswer(option || {dataset:{san:move.san}},solution);
  return 'snapback';
}

function loadDailyPuzzle(){
  const puzzle = dailyQueue[dailyIdx];
  if(!puzzle){ showDailyDone(); return; }
  dailyLocked = false;
  dailyGame = puzzle.fen ? new Chess(puzzle.fen) : new Chess();
  if(puzzle.setupMoves) puzzle.setupMoves.forEach(move => dailyGame.move(move));
  const orientation = dailyGame.turn() === 'b' ? 'black' : 'white';
  dailyBoard.orientation(orientation);
  dailyBoard.position(dailyGame.fen(),false);
  renderCoords('daily-ranks','daily-files',orientation);
  clearHighlights('#daily-board');
  const colorLabel = dailyGame.turn() === 'b' ? 'Noirs' : 'Blancs';
  document.getElementById('daily-question').textContent = `Quel est le meilleur coup pour les ${colorLabel} ?`;
  document.getElementById('daily-coach-text').textContent = puzzle.hint || 'Cherche d’abord les échecs, puis les prises et les menaces.';
const hintButton=document.getElementById('daily-hint-button'); if(hintButton){hintButton.disabled=false;hintButton.innerHTML='<b>?</b><span>Indication</span>';}
  const solution = puzzle.solution.replace(/[!?]+$/,'');
  const moverColor = dailyGame.turn();
  const options = buildMcqOptions(dailyGame,solution,4);
  const container = document.getElementById('daily-mcq-options');
  container.innerHTML = options.map((option,index) => `
    <button class="mcq-option" data-san="${escapeHtml(option)}">
      <span class="mcq-letter">${String.fromCharCode(65 + index)}</span>
      <span>${escapeHtml(toFigurine(option,moverColor))}</span>
    </button>`).join('');
  container.querySelectorAll('.mcq-option').forEach(button => {
    button.onclick = () => onDailyAnswer(button,solution);
  });
  requestAnimationFrame(() => fitBoards('daily-board',dailyBoard,'.daily-board-wrap'));
}

function onDailyAnswer(button,solution){
  if(dailyLocked) return;
  dailyLocked = true;
  const correct = button.dataset.san === solution;
  document.querySelectorAll('#daily-mcq-options .mcq-option').forEach(option => {
    option.disabled = true;
    if(option.dataset.san === solution) option.classList.add('correct');
    else if(option === button) option.classList.add('wrong');
  });
  if(typeof showMascotReaction === 'function'){
    showMascotReaction(correct ? 'best' : 'mistake',correct
      ? 'Tu as vérifié les coups forcés avant de jouer.'
      : 'Repars des échecs possibles : ils forcent souvent la réponse adverse.',{
        imageSelector:'[data-mascot-image]',textSelector:'[data-mascot-text]',speak:false
      });
  }
  if(typeof playSound === 'function') playSound(correct ? 'correct' : 'wrong');
  if(correct){
    bumpDailyCounter('puzzlesSolvedToday');
    updateDailyProgressUI();
    dailyIdx += 1;
    setTimeout(() => {
      if(PROGRESS.dailyProgress.rewardClaimed || dailyIdx >= dailyQueue.length) showDailyDone();
      else loadDailyPuzzle();
    },1050);
  }else{
    setTimeout(loadDailyPuzzle,1350);
  }
}

function updateDailyProgressUI(){
  ensureDailyProgressFresh();
  const challenge = todayChallenge();
  const current = Math.min(challenge.target,PROGRESS.dailyProgress.puzzlesSolvedToday || 0);
  document.getElementById('daily-challenge-fill').style.width = `${Math.round((current / challenge.target) * 100)}%`;
  document.getElementById('daily-challenge-progress').textContent = `${current}/${challenge.target}`;
  document.getElementById('daily-gem-count').textContent = crownBalance();
  document.getElementById('daily-reward-copy').textContent = `${formatCrowns(challenge.crowns || QUEST_REWARDS.daily,true)} · +${challenge.xp} XP`;
}

function showDailyDone(){
  document.getElementById('daily-puzzle-mode').classList.add('hidden');
  document.getElementById('daily-done-banner').classList.remove('hidden');
  const challenge = todayChallenge();
  document.getElementById('daily-done-copy').textContent = `${formatCrowns(challenge.crowns || QUEST_REWARDS.daily,true)} et +${challenge.xp} XP ajoutés. Reviens demain pour poursuivre ta série.`;
  if(typeof fireConfetti === 'function') fireConfetti('badge');
  if(typeof showMascotReaction === 'function') showMascotReaction('treasure','Le défi quotidien est accompli. La récompense est à nous.',{toast:true});
}

function initDailyChallenge(){
  ensureDailyProgressFresh();
  updateDailyProgressUI();
  if(PROGRESS.dailyProgress.rewardClaimed){ showDailyDone(); return; }
  document.getElementById('daily-puzzle-mode').classList.remove('hidden');
  ensureDailyBoard();
  const target = todayChallenge().target;
  dailyQueue = pickDailyPuzzles(target);
  dailyIdx = Math.min(PROGRESS.dailyProgress.puzzlesSolvedToday || 0,Math.max(0,dailyQueue.length - 1));
  loadDailyPuzzle();
  watchBoardResize('daily-board',() => dailyBoard,'.daily-board-wrap');
}

document.getElementById('daily-hint-button').onclick=()=>{
  if(dailyLocked || !dailyGame || !dailyQueue[dailyIdx]) return;
  const solution=(dailyQueue[dailyIdx].solution||'').replace(/[!?]+$/,'');
  const move=dailyGame.moves({verbose:true}).find(candidate=>candidate.san===solution);
  if(!move)return;
  flashSquares('#daily-board',[move.from,move.to],'hint-square',1800);
  document.getElementById('daily-coach-text').textContent=`Le ${pieceNameFromSan(solution)} en ${move.from.toUpperCase()} a quelque chose de royal à faire.`;
  document.getElementById('daily-hint-button').disabled=true;
};

initDailyChallenge();
</script>
