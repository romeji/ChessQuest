<!doctype html>
<html lang="fr"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073d31">
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icons/chessquest-app-icon.png"><title>ChessQuest — Salon des défis</title>
  <link rel="stylesheet" href="assets/css/variables.css"><link rel="stylesheet" href="assets/css/reset.css"><link rel="stylesheet" href="assets/css/layout.css"><link rel="stylesheet" href="assets/css/components.css?v=105"><link rel="stylesheet" href="assets/css/gamification.css?v=44"><link rel="stylesheet" href="assets/css/profile.css?v=106"><link rel="stylesheet" href="assets/css/navigation.css?v=101"><link rel="stylesheet" href="assets/css/navigation-stability-v101.css">
  <script src="assets/js/pwa-bootstrap-v101.js"></script><script defer src="assets/js/navigation.js?v=107"></script>
<link rel="stylesheet" href="assets/css/theme-chesscom-dark.css">
<link rel="stylesheet" href="assets/css/friends-chesscom-authentic.css">
</head><body class="quest-screen friend-lounge-page"><main class="app"><section class="page">
  <div class="cq-friends-top">
    <a class="back-btn" href="index.html" aria-label="Retour">←</a>
    <h1>Amis</h1>
    <a class="icon-btn" href="#" id="friend-share-top" aria-label="Partager">☰</a>
  </div>

  <section id="incoming-invite" class="friend-invite-card hidden" aria-live="polite"></section>

  <div class="cq-friends-menu">
    <button class="cq-friends-menu-row" type="button" id="menu-search-contacts"><span class="ic">🔍</span>Rechercher des contacts</button>
    <button class="cq-friends-menu-row" type="button" id="menu-invite"><span class="ic">✉️</span>Inviter des amis</button>
    <button class="cq-friends-menu-row qr" type="button" id="menu-qr"><span class="ic">▤</span>Partager le code QR</button>
    <button class="cq-friends-menu-row link" type="button" id="menu-challenge-link"><span class="ic">🔗</span>Envoyez un lien de défi</button>
  </div>

  <input class="cq-friends-search" id="friend-name" autocomplete="off" maxlength="24" placeholder="Rechercher par nom ou nom d'utilisateur">
  <p id="friend-status" class="friend-status" aria-live="polite"></p>

  <div class="cq-friends-section-head">
    <h2>Amis <span id="friend-count-num">0</span></h2>
    <a href="progress.html#badges">🏅 Classement</a>
  </div>
  <div id="friend-list"></div>

  <button class="cq-challenge-toggle" type="button" id="toggle-challenge-form">⚔ Configurer un défi personnalisé</button>

  <section class="friend-lounge-card friend-create-card hidden" id="challenge-form-card">
    <div class="friend-card-title"><span>⚔</span><div><strong>Créer un défi</strong><small>Ton ami n’aura plus qu’à accepter l’invitation.</small></div></div>
    <label class="friend-input-label" for="challenge-friend">Adversaire</label>
    <select id="challenge-friend" class="friend-full-select"><option value="">Choisir plus tard — partager un lien</option></select>
    <div class="friend-options">
      <label>Cadence<select id="friend-time"><option value="60">1 min · Bullet</option><option value="300" selected>5 min · Blitz</option><option value="600">10 min · Rapide</option></select></label>
      <label>Ta couleur<select id="friend-color"><option value="random">Aléatoire</option><option value="white">Blancs</option><option value="black">Noirs</option></select></label>
    </div>
    <button id="friend-challenge" class="friend-create-button" type="button"><span>♟</span> Créer mon défi</button>
  </section>

  <section id="friend-invite-card" class="friend-invite-card hidden" aria-live="polite"><span class="friend-invite-icon">✉</span><div><strong>Défi prêt !</strong><p>Envoie ce lien à ton ami. La partie démarre dès qu’il le rejoint.</p></div><div class="friend-invite-actions"><button id="friend-share" type="button">Partager</button><button id="friend-copy" type="button">Copier le lien</button><a id="friend-enter" href="friend-game.html">Ouvrir l’échiquier →</a></div></section>
  <div id="friend-add-hidden" style="display:none"><button id="friend-add" type="button"></button></div>
</section></main><nav class="tabbar" aria-label="Navigation principale"></nav>
<script src="assets/js/progress.js?v=105"></script><script src="assets/js/app.js?v=108"></script>
<script>
const FRIENDS_KEY='chessQuestFriends', $=id=>document.getElementById(id);let friends=[];let inviteUrl='';try{friends=JSON.parse(localStorage.getItem(FRIENDS_KEY)||'[]')}catch{}
function save(){localStorage.setItem(FRIENDS_KEY,JSON.stringify(friends));}
function render(){
  $('friend-count-num').textContent = friends.length;
  $('friend-list').innerHTML = friends.length ? friends.map((name,index)=>`
    <div class="cq-friend-list-row">
      <span class="av">🙂</span>
      <span class="body">
        <span class="name">${escapeHtml(name)}</span>
        <span class="sub">Disponible pour un défi</span>
      </span>
      <span class="actions">
        <button type="button" class="go" data-quick-challenge="${escapeHtml(name)}" aria-label="Défier ${escapeHtml(name)}">+</button>
        <button type="button" class="remove" data-remove="${index}" aria-label="Retirer ${escapeHtml(name)}">✕</button>
      </span>
    </div>`).join('') : '<div class="cq-friends-empty"><span>♞</span><p>Ta cour est vide. Invite quelqu’un à croiser le fer.</p></div>';
  $('challenge-friend').innerHTML='<option value="">Choisir plus tard — partager un lien</option>'+friends.map(name=>`<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join('');
  document.querySelectorAll('[data-remove]').forEach(button=>button.onclick=()=>{friends.splice(Number(button.dataset.remove),1);save();render();});
  document.querySelectorAll('[data-quick-challenge]').forEach(button=>button.onclick=()=>{
    $('challenge-form-card').classList.remove('hidden');
    $('challenge-friend').value=button.dataset.quickChallenge;
    $('challenge-form-card').scrollIntoView({behavior:'smooth',block:'nearest'});
  });
}
$('toggle-challenge-form').onclick=()=>{$('challenge-form-card').classList.toggle('hidden');if(!$('challenge-form-card').classList.contains('hidden'))$('challenge-form-card').scrollIntoView({behavior:'smooth',block:'nearest'});};
$('menu-challenge-link').onclick=()=>$('toggle-challenge-form').click();
$('menu-search-contacts').onclick=async()=>{
  /* L'accès aux contacts est toujours déclenché par un geste explicite.
     Le navigateur affiche alors sa propre demande d'autorisation. */
  if(!navigator.contacts?.select){
    $('friend-name').focus();
    $('friend-status').textContent='La lecture des contacts n’est pas disponible ici. Entre le pseudo ChessQuest de ton ami.';
    return;
  }
  try{
    const contacts=await navigator.contacts.select(['name'],{multiple:true});
    const names=contacts.map(contact=>String(contact.name?.[0]||'').trim()).filter(Boolean);
    if(!names.length){$('friend-status').textContent='Aucun contact sélectionné.';return;}
    $('friend-name').value=names[0];
    $('friend-status').textContent=`${names.length} contact${names.length>1?'s':''} sélectionné${names.length>1?'s':''}. Vérifie leur pseudo ChessQuest puis ajoute-les.`;
    $('friend-name').focus();
  }catch(error){
    $('friend-status').textContent='Lecture des contacts annulée. Tu peux rechercher un ami par son pseudo.';
  }
};
$('menu-invite').onclick=async()=>{const url=location.origin+location.pathname;if(navigator.share){try{await navigator.share({title:'ChessQuest',text:'Rejoins-moi sur ChessQuest !',url});}catch(e){}}else{try{await navigator.clipboard.writeText(url);$('friend-status').textContent='Lien de l’app copié ✓';}catch(e){}}};
$('menu-qr').onclick=()=>openQrModal(location.origin+location.pathname);
$('friend-share-top').onclick=(e)=>{e.preventDefault();$('menu-invite').click();};

function openQrModal(text){
  let modal=document.getElementById('qr-modal');
  if(!modal){
    modal=document.createElement('div');
    modal.id='qr-modal';
    modal.className='cq-qr-modal';
    modal.innerHTML='<div class="cq-qr-card"><button type="button" class="cq-qr-close" aria-label="Fermer">✕</button><div class="cq-qr-icon">📱</div><strong>Ton lien ChessQuest</strong><p id="qr-link-text"></p><div class="cq-qr-actions"><button type="button" class="cq-qr-copy">Copier le lien</button><button type="button" class="cq-qr-native-share">Partager</button></div></div>';
    document.body.appendChild(modal);
    modal.querySelector('.cq-qr-close').onclick=()=>modal.classList.remove('open');
    modal.onclick=(e)=>{ if(e.target===modal) modal.classList.remove('open'); };
    modal.querySelector('.cq-qr-copy').onclick=async()=>{ try{ await navigator.clipboard.writeText(modal.dataset.link||''); const btn=modal.querySelector('.cq-qr-copy'); btn.textContent='Copié ✓'; setTimeout(()=>btn.textContent='Copier le lien',1500);}catch(e){} };
    modal.querySelector('.cq-qr-native-share').onclick=async()=>{ if(navigator.share){ try{ await navigator.share({title:'ChessQuest', url:modal.dataset.link}); }catch(e){} } };
  }
  modal.dataset.link=text;
  modal.querySelector('#qr-link-text').textContent=text;
  modal.classList.add('open');
}
async function questUserReady(){for(let i=0;i<40&&typeof questCurrentUser!=='function';i++)await new Promise(resolve=>setTimeout(resolve,100));return typeof questCurrentUser==='function'?questCurrentUser():null;}
function addFriend(){const name=$('friend-name').value.trim();if(!name)return;if(friends.some(friend=>friend.toLowerCase()===name.toLowerCase())){$('friend-status').textContent='Cet ami est déjà dans ta cour.';return;}friends.push(name);save();$('friend-name').value='';$('friend-status').textContent=`${name} est prêt pour un défi.`;render();}
$('friend-add').onclick=addFriend;$('friend-name').addEventListener('keydown',event=>{if(event.key==='Enter')addFriend();});
function showInvite(url){inviteUrl=url;$('friend-enter').href=url;$('friend-invite-card').classList.remove('hidden');$('friend-invite-card').scrollIntoView({behavior:'smooth',block:'nearest'});}
function handleFor(name){return String(name||'').trim().toLowerCase().replace(/[^a-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,24);}
async function findFriendProfile(name){const handle=handleFor(name);if(!handle)return null;const snap=await firebase.firestore().collection('publicProfiles').where('handle','==',handle).limit(1).get();return snap.empty?null:Object.assign({uid:snap.docs[0].id},snap.docs[0].data());}
$('friend-challenge').onclick=async()=>{const user=await questUserReady();if(!user){$('friend-status').textContent='Connecte-toi avec Google avant de créer un défi.';return;}if(!window.firebase?.firestore){$('friend-status').textContent='Connexion en cours, réessaie dans une seconde.';return;}const ownerColor=$('friend-color').value==='random'?(Math.random()<.5?'white':'black'):$('friend-color').value;const target=$('challenge-friend').value;$('friend-challenge').disabled=true;$('friend-status').textContent='Préparation de l’arène…';try{const targetProfile=target?await findFriendProfile(target):null;const ref=firebase.firestore().collection('matches').doc();await ref.set({ownerUid:user.uid,participantIds:[user.uid],players:{[user.uid]:{name:user.displayName||'Joueur',photoURL:user.photoURL||'',color:ownerColor}},invitedName:target||null,timeControl:Number($('friend-time').value),ownerColor,status:'waiting',fen:'start',moves:[],turn:'w',drawOffer:null,createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});const url=new URL(`friend-game.html?match=${encodeURIComponent(ref.id)}`,location.href).href;if(target&&targetProfile&&targetProfile.uid!==user.uid){await firebase.firestore().collection('invitations').add({senderUid:user.uid,senderName:user.displayName||'Un ami',senderPhotoURL:user.photoURL||'',recipientUid:targetProfile.uid,recipientName:targetProfile.displayName||target,matchId:ref.id,matchUrl:url,timeLabel:$('friend-time').selectedOptions[0].textContent,status:'waiting',createdAt:firebase.firestore.FieldValue.serverTimestamp()});$('friend-status').textContent=`Invitation envoyée à ${targetProfile.displayName||target} : sa cloche va sonner.`;}else if(target){$('friend-status').textContent=`${target} n’est pas encore repéré dans ChessQuest. Partage le lien ci-dessous.`;}else $('friend-status').textContent='Invitation prête à partager.';showInvite(url);}catch(error){console.error(error);$('friend-status').textContent='Impossible de créer le défi. Vérifie ta connexion puis réessaie.';}finally{$('friend-challenge').disabled=false;}};
$('friend-copy').onclick=async()=>{try{await navigator.clipboard.writeText(inviteUrl);$('friend-copy').textContent='Lien copié ✓';setTimeout(()=>{$('friend-copy').textContent='Copier le lien';},1700);}catch(e){prompt('Copie ce lien :',inviteUrl);}};$('friend-share').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'Défi ChessQuest',text:'Je te défie aux échecs !',url:inviteUrl});}catch(e){}}else $('friend-copy').click();};
async function loadIncomingInvite(){const inviteId=new URLSearchParams(location.search).get('invite');if(!inviteId)return;const user=await questUserReady();if(!user||!window.firebase?.firestore)return;try{const ref=firebase.firestore().collection('invitations').doc(inviteId);const snap=await ref.get();if(!snap.exists)return;const invite=snap.data();if(invite.recipientUid!==user.uid||invite.status!=='waiting')return;const card=$('incoming-invite');card.innerHTML=`<span class="friend-invite-icon">⚔</span><div><strong>${escapeHtml(invite.senderName||'Un ami')} te défie !</strong><p>${escapeHtml(invite.timeLabel||'Partie amicale')} · choisis ton courage et entre dans l’arène.</p></div><div class="friend-invite-actions"><button id="invite-decline" type="button">Décliner</button><button id="invite-accept" type="button">Accepter le défi</button></div>`;card.classList.remove('hidden');$('invite-decline').onclick=()=>ref.update({status:'declined'}).then(()=>card.remove());$('invite-accept').onclick=async()=>{await ref.update({status:'accepted'});location.href=invite.matchUrl||`friend-game.html?match=${encodeURIComponent(invite.matchId)}`;};}catch(error){console.warn(error);}}
render();loadIncomingInvite();
</script></body></html>
