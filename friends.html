<!doctype html>
<html lang="fr"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#064b39">
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icons/chessquest-app-icon.png"><title>ChessQuest — Amis</title>
  <link rel="stylesheet" href="assets/css/variables.css"><link rel="stylesheet" href="assets/css/reset.css"><link rel="stylesheet" href="assets/css/components.css?v=104"><link rel="stylesheet" href="assets/css/gamification.css?v=44"><link rel="stylesheet" href="assets/css/profile.css"><link rel="stylesheet" href="assets/css/navigation.css?v=101"><link rel="stylesheet" href="assets/css/navigation-stability-v101.css">
  <script src="assets/js/pwa-bootstrap-v101.js"></script><script defer src="assets/js/navigation.js?v=107"></script>
</head><body class="quest-screen"><main class="app"><section class="page">
  <header class="quest-page-title"><a class="subpage-back" href="profile.html" aria-label="Retour">‹</a><h1>Amis & défis</h1><span></span></header>
  <section class="quest-card friend-hero"><strong>Joue avec tes amis</strong><p>Crée un défi et partage le lien : l’échiquier se synchronise dès que ton adversaire le rejoint.</p></section>
  <section class="quest-card"><label class="field-label" for="friend-name">Pseudo de ton ami</label><div class="friend-add-row"><input id="friend-name" autocomplete="off" placeholder="ex. AlexChess"><button id="friend-add" class="primary-btn" type="button">Ajouter</button></div><div id="friend-list" class="friend-list"></div></section>
  <section class="quest-card"><h2>Créer un défi</h2><div class="friend-options"><label>Durée<select id="friend-time"><option value="600">10 min</option><option value="300">5 min</option><option value="60">1 min</option></select></label><label>Couleur<select id="friend-color"><option value="random">Aléatoire</option><option value="white">Blancs</option><option value="black">Noirs</option></select></label></div><button id="friend-challenge" class="primary-btn" type="button">Créer le défi</button><p id="friend-status" class="section-sub" aria-live="polite"></p></section>
</section></main><nav class="tabbar" aria-label="Navigation principale"></nav>
<script src="assets/js/progress.js?v=105"></script><script src="assets/js/app.js?v=107"></script>
<script>
const FRIENDS_KEY='chessQuestFriends', $=id=>document.getElementById(id);
let friends=[];try{friends=JSON.parse(localStorage.getItem(FRIENDS_KEY)||'[]')}catch{}
function save(){localStorage.setItem(FRIENDS_KEY,JSON.stringify(friends));}
function render(){
  $('friend-list').innerHTML=friends.length?friends.map(name=>`<div class="friend-row"><span>♞ ${escapeHtml(name)}</span><button type="button" data-remove="${escapeHtml(name)}">Retirer</button></div>`).join(''):'<p class="section-sub">Aucun ami ajouté pour le moment.</p>';
  document.querySelectorAll('[data-remove]').forEach(button=>button.onclick=()=>{friends=friends.filter(name=>name!==button.dataset.remove);save();render();});
}
async function questUserReady(){for(let i=0;i<30&&typeof questCurrentUser!=='function';i++)await new Promise(resolve=>setTimeout(resolve,100));return typeof questCurrentUser==='function'?questCurrentUser():null;}
$('friend-add').onclick=()=>{const name=$('friend-name').value.trim();if(!name)return;if(!friends.includes(name))friends.push(name);save();$('friend-name').value='';render();};
$('friend-challenge').onclick=async()=>{
  const user=await questUserReady(); if(!user){$('friend-status').textContent='Connecte-toi pour créer un défi.';return;}
  const ownerColor=$('friend-color').value==='random'?(Math.random()<.5?'white':'black'):$('friend-color').value;
  const ref=firebase.firestore().collection('matches').doc();
  await ref.set({ownerUid:user.uid,participantIds:[user.uid],players:{[user.uid]:{name:user.displayName||'Joueur',photoURL:user.photoURL||'',color:ownerColor}},timeControl:Number($('friend-time').value),ownerColor,status:'waiting',fen:'start',moves:[],turn:'w',drawOffer:null,createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
  location.href=`friend-game.html?match=${encodeURIComponent(ref.id)}`;
};
render();
</script></body></html>
