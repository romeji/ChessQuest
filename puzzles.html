<body data-page="puzzles">
<div id="toast-container"></div>
<div class="app">
  <section class="page">
    <a class="subpage-back" aria-label="Retour" href="index.html" style="margin-bottom:16px;">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </a>

    <div class="board-frame" style="margin:0 auto 20px;display:block;width:fit-content;">
      <div class="coord-ranks" id="puzzle-ranks"></div>
      <div id="puzzle-board"></div>
      <div class="coord-files" id="puzzle-files"></div>
    </div>

    <div class="mcq-options" id="mcq-options"></div>
  </section>
</div>

<nav class="tabbar">
  <button class="tabbar-item" data-tab="home" data-href="index.html">
    <svg viewBox="0 0 24 24" class="tabicon"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span>Accueil</span>
  </button>
  <button class="tabbar-item" data-tab="learn" data-href="learn.html">
    <svg viewBox="0 0 24 24" class="tabicon"><circle cx="6" cy="19" r="2.5"/><circle cx="12" cy="11" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M6 16.5V13a2 2 0 0 1 2-2h1.5M14.5 9H16a2 2 0 0 0 2-2V5.5"/></svg><span>Parcours</span>
  </button>
  <button class="tabbar-item" data-tab="coach" data-href="coach.html">
    <svg viewBox="0 0 24 24" class="tabicon"><path d="M12 2a2.5 2.5 0 0 0-2 4 4 4 0 0 0-1.6 5.4C7.2 12.4 6 14.2 6 17h12c0-2.8-1.2-4.6-2.4-5.6A4 4 0 0 0 14 6a2.5 2.5 0 0 0-2-4Z"/><rect x="5" y="19" width="14" height="3" rx="1"/></svg>
    <span>Coach</span>
  </button>
  <button class="tabbar-item" data-tab="progress" data-href="progress.html">
    <svg viewBox="0 0 24 24" class="tabicon"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 15l4-5 3 3 5-7"/></svg><span>Progrès</span>
  </button>
  <button class="tabbar-item" data-tab="profile" data-href="profile.html">
    <svg viewBox="0 0 24 24" class="tabicon"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/></svg><span>Profil</span>
  </button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script src="assets/js/animations.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/navigation.js"></script>
<script src="assets/js/board.js"></script>
<script src="assets/js/openings.js"></script>
<script src="assets/js/puzzles.js"></script>
<script>
const urlParams = new URLSearchParams(location.search);
const urlSource = urlParams.get('source');
const urlTheme = urlParams.get('theme');
if(urlSource === 'mistakes' || urlSource === 'random') puzzleSource = urlSource;
if(urlTheme) puzzleThemeFilter = urlTheme;
ensurePuzzleBoard();
watchBoardResize('puzzle-board', () => puzzleBoard, '.page');
</script>
