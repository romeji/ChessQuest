<script>
const urlParams = new URLSearchParams(location.search);
const urlSource = urlParams.get('source');
const urlTheme = urlParams.get('theme');
if(urlSource === 'mistakes' || urlSource === 'random') puzzleSource = urlSource;
if(urlTheme) puzzleThemeFilter = urlTheme;
ensurePuzzleBoard();
watchBoardResize('puzzle-board', () => puzzleBoard, '.page');
document.querySelectorAll('.puzzle-source').forEach(button => button.classList.toggle('active', button.id === `src-${puzzleSource}`));

function selectPuzzleSource(source){
  puzzleSource = source;
  puzzleThemeFilter = 'all';
  document.querySelectorAll('.puzzle-source').forEach(button => button.classList.toggle('active', button.id === `src-${source}`));
  renderThemeFilters();
  if(source === 'random'){
    generatedPuzzle = null;
    buildPuzzleQueue();
    generateRandomPuzzle();
  }else{
    buildPuzzleQueue();
    loadPuzzle(0);
  }
  refreshPuzzleHeader();
}
document.getElementById('src-classic').onclick = () => selectPuzzleSource('classic');
document.getElementById('src-random').onclick = () => selectPuzzleSource('random');
document.getElementById('src-mistakes').onclick = () => selectPuzzleSource('mistakes');
document.getElementById('puzzle-hint-btn').onclick = showPuzzleHint;
</script>
