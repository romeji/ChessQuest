<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fffaf0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ChessQuest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/chessquest-app-icon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/chessquest-app-icon.png">
<title>ChessQuest — Problèmes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/reset.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/animations.css">
<link rel="stylesheet" href="assets/css/puzzle.css">
<link rel="stylesheet" href="assets/css/polish.css">
<link rel="stylesheet" href="assets/css/final-views.css?v=39">
<link rel="stylesheet" href="assets/css/responsive-hardening.css?v=43">
<link rel="stylesheet" href="assets/css/gamification.css?v=44">
<link rel="stylesheet" href="assets/css/ux-refinement.css?v=59">
</head>
<body data-page="puzzles" class="final-shell-page puzzle-final-page">
<div id="toast-container"></div>
<main class="app">
  <section class="page">
    <header class="final-page-title">
      <a class="subpage-back" href="index.html" aria-label="Retour à l’accueil">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <h1 id="puzzle-page-title">Problème du jour</h1>
      <div class="puzzle-final-rating" aria-label="Classement puzzle">
        <strong id="puzzle-rating-value">800</strong>
        <em id="puzzle-rating-delta"></em>
      </div>
    </header>

    <div class="puzzle-battle-timer hidden" id="puzzle-battle-timer" aria-live="polite">30s</div>
    <div class="puzzle-countdown hidden" id="puzzle-countdown" aria-live="assertive"><strong>3</strong><span>Prépare-toi</span></div>

    <div class="puzzle-final-turn">
      <img class="puzzle-final-coach" data-mascot-image src="assets/illustrations/mascot-coach-encourage.webp" alt="Coach ChessQuest">
      <span class="puzzle-final-turn-copy" data-mascot-text>
        <strong>À toi de jouer</strong>
        <small>Trouve le meilleur coup.</small>
      </span>
      <button class="puzzle-final-hint" id="puzzle-hint-btn" type="button">Indice</button>
    </div>

    <div class="puzzle-final-board-wrap">
      <div class="board-frame">
        <div class="coord-ranks" id="puzzle-ranks"></div>
        <div id="puzzle-board"></div>
        <div class="coord-files" id="puzzle-files"></div>
      </div>
    </div>

    <div class="mcq-options" id="mcq-options"></div>
    <div class="puzzle-final-feedback prompt" id="puzzle-feedback">Observe la position puis choisis ton coup.</div>

    <div class="final-card puzzle-final-streak">
      <strong>🔥 Série : <span id="puzzle-streak-value">0</span></strong>
      <div class="progress-dots" id="puzzle-dots" aria-label="Progression"></div>
      <span class="puzzle-final-flag" aria-hidden="true">⚑</span>
    </div>
    <div class="puzzle-review-nav hidden" id="puzzle-review-nav">
      <button type="button" id="mistake-prev" aria-label="Erreur précédente">←</button>
      <span>Erreurs déjà corrigées</span>
      <button type="button" id="mistake-next" aria-label="Erreur suivante">→</button>
    </div>

    <div class="puzzle-hidden-data" aria-hidden="true">
      <span id="puzzle-question">Trouve le meilleur coup !</span>
      <span id="puzzle-kind"></span>
      <div id="puzzle-stats"></div>
    </div>
  </section>
</main>
<div class="mode-bottom-dock">
  <button class="mode-menu-button" id="puzzle-mode-button" type="button" aria-expanded="false" aria-controls="puzzle-mode-sheet">☷</button>
  <button class="mode-primary-button" id="puzzle-primary-action" type="button">Résoudre le problème du jour</button>
  <div class="mode-sheet hidden" id="puzzle-mode-sheet">
    <strong>Choisir un mode</strong>
    <button data-puzzle-mode="daily">🎯 Problème du jour</button>
    <button data-puzzle-mode="random">🎲 Problème aléatoire</button>
    <button data-puzzle-mode="mistakes">🧠 Corriger mes erreurs <span id="mistakes-count-badge"></span></button>
    <button data-puzzle-mode="review">↩ Revoir mes erreurs corrigées</button>
    <button data-puzzle-mode="battle">⚡ Bataille de problèmes</button>
    <a href="training-target.html">⚙ Personnalisé</a>
    <div class="battle-lengths hidden" id="battle-lengths"><button data-battle="30">30 s</button><button data-battle="45">45 s</button><button data-battle="60">60 s</button></div>
  </div>
</div>
<nav class="tabbar" aria-label="Navigation principale"></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
<script src="assets/js/progress.js"></script>
<script src="assets/js/chesscom.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/mascot-coach.js?v=44"></script>
<script src="assets/js/navigation.js"></script>
<script src="assets/js/board.js"></script>
<script src="assets/js/openings.js"></script>
<script src="assets/js/puzzles.js"></script>
<script>
const urlParams = new URLSearchParams(location.search);
const secretLevel = urlParams.get('secret');
if(secretLevel && !isSecretUnlocked(secretLevel)){
  showMascotReaction('locked', "Tu pensais vraiment entrer sans clé ? La boutique, sujet.", {toast:true});
  setTimeout(() => location.replace('secret-levels.html'), 900);
}
const urlSource = urlParams.get('source');
if(['daily','random','mistakes','review'].includes(urlSource)) puzzleSource = urlSource;
const urlTheme = urlParams.get('theme');
if(urlTheme && CLASSIC_PUZZLES.some(puzzle => puzzle.theme === urlTheme)) puzzleTheme = urlTheme;
ensurePuzzleBoard();
watchBoardResize('puzzle-board', () => puzzleBoard, '.puzzle-final-board-wrap');

function selectPuzzleSource(source){
  stopPuzzleBattle();
  puzzleSource = source;
  puzzleTheme = '';
  buildPuzzleQueue();
  loadPuzzle(0);
  refreshPuzzleHeader();
  const labels={daily:'Problème du jour',random:'Problème aléatoire',mistakes:'Corriger mes erreurs',review:'Erreurs corrigées'};
  document.getElementById('puzzle-page-title').textContent=labels[source]||'Problèmes';
  document.getElementById('puzzle-primary-action').textContent=labels[source]||'Résoudre un problème';
  document.getElementById('puzzle-review-nav').classList.toggle('hidden',source!=='review');
  if(source==='daily' && (PROGRESS.dailyProgress?.puzzlesSolvedToday||0)>0) setPuzzleFeedback('Problème du jour déjà réussi. Tu peux le rejouer ou choisir un autre mode dans le menu.','prompt');
}
const modeButton=document.getElementById('puzzle-mode-button'), modeSheet=document.getElementById('puzzle-mode-sheet');
modeButton.onclick=()=>{const open=modeSheet.classList.toggle('hidden')===false;modeButton.setAttribute('aria-expanded',String(open));};
document.querySelectorAll('[data-puzzle-mode]').forEach(button=>button.onclick=()=>{
  if(button.dataset.puzzleMode==='battle'){document.getElementById('battle-lengths').classList.remove('hidden');return;}
  modeSheet.classList.add('hidden'); selectPuzzleSource(button.dataset.puzzleMode);
});
document.querySelectorAll('[data-battle]').forEach(button=>button.onclick=()=>{modeSheet.classList.add('hidden');document.getElementById('puzzle-page-title').textContent='Bataille de problèmes';startPuzzleBattle(Number(button.dataset.battle));});
document.getElementById('mistake-prev').onclick=()=>loadPuzzle(puzzleIndex-1);
document.getElementById('mistake-next').onclick=()=>loadPuzzle(puzzleIndex+1);
document.getElementById('puzzle-primary-action').onclick=()=>{document.querySelector('.puzzle-final-board-wrap').scrollIntoView({behavior:'smooth',block:'center'});};
document.getElementById('puzzle-hint-btn').onclick = showPuzzleHint;
selectPuzzleSource(puzzleSource);
</script>
</body>
</html>
