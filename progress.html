<body data-page="progress" class="quest-screen progress-page">
<div id="toast-container"></div>
<main class="app">
  <section class="page">
    <header class="quest-page-title">
      <span></span>
      <h1>Mes progrès</h1>
      <a class="quest-currency" id="progress-gem-count" href="shop.html" aria-label="Ouvrir la boutique royale">0</a>
    </header>

    <section class="quest-card progress-rank-card">
      <div class="progress-rank-emblem" aria-hidden="true"></div>
      <div class="progress-rank-copy">
        <div class="eyebrow">Niveau actuel</div>
        <h2 id="progress-rank-title">Stratège</h2>
        <div class="progress-rank-rating">ELO actuel</div>
        <div class="progress-rank-number"><span id="progress-rating">—</span> <small id="progress-rating-delta"></small></div>
      </div>
      <div class="rank-track">
        <div class="track"><div class="track-fill" id="progress-rank-fill"></div></div>
        <div class="rank-scale"><span id="rank-min">1600</span><span id="rank-mid">1700</span><span id="rank-max">1800</span></div>
      </div>
    </section>

    <section class="progress-chart-panel">
      <div class="progress-chart-head"><strong>Évolution ELO</strong><span class="progress-period">30 jours⌄</span></div>
      <svg id="elo-chart-svg" viewBox="0 0 320 130" preserveAspectRatio="none" aria-label="Évolution du classement Elo"></svg>
      <div class="elo-chart-dates" id="elo-chart-dates"></div>
    </section>

    <div class="progress-streak-grid">
      <section class="progress-streak-card">
        <span>Série actuelle</span>
        <strong>🔥 <span id="current-streak">0</span><small> jours</small></strong>
        <small>Continue comme ça !</small>
      </section>
      <section class="progress-streak-card">
        <span>Meilleure série</span>
        <strong>🏆 <span id="best-streak">0</span><small> jours</small></strong>
      </section>
    </div>

    <section class="quest-card progress-badges-card">
      <div class="progress-card-head"><strong>Badges</strong><a href="profile.html">Voir tout ›</a></div>
      <div class="progress-badge-row">
        <div class="progress-badge-item"><div class="badge-shield"></div><span>Tacticien</span></div>
        <div class="progress-badge-item"><div class="badge-shield"></div><span>Visionnaire</span></div>
        <div class="progress-badge-item"><div class="badge-shield"></div><span>Finisseur</span></div>
        <div class="progress-badge-item"><div class="badge-shield"></div><span>Stratège</span></div>
        <div class="progress-badge-item"><div class="badge-shield"></div><span>Régulier</span></div>
      </div>
    </section>

    <section class="quest-card progress-xp-card">
      <strong>Progression du niveau</strong>
      <div class="progress-xp-value"><b id="weekly-xp">0</b> / <span id="level-xp-target">150</span> XP</div>
      <div class="track"><div class="track-fill" id="weekly-xp-fill"></div></div>
      <div class="progress-xp-chest" aria-hidden="true"></div>
    </section>

<script>
function rankTitle(rating){
  if(rating >= 2000) return 'Maître';
  if(rating >= 1600) return 'Stratège';
  if(rating >= 1300) return 'Tacticien';
  if(rating >= 1000) return 'Chevalier';
  return 'Apprenti';
}

function ratingHistory(state,username){
  return (state.games || [])
    .filter(game => game.time_class === 'rapid')
    .slice()
    .sort((a,b) => (a.end_time || 0) - (b.end_time || 0))
    .map(game => {
      const white = game.white?.username?.toLowerCase() === username;
      const rating = Number(white ? game.white?.rating : game.black?.rating);
      return {rating,date:game.end_time || 0};
    })
    .filter(point => Number.isFinite(point.rating))
    .slice(-30);
}

function drawProgressChart(points,current){
  const svg = document.getElementById('elo-chart-svg');
  const dates = document.getElementById('elo-chart-dates');
  const hasHistory = points.length >= 2;
  if(points.length < 2){
    const baseline = Number(current) || 1200;
    points = [
      {rating:baseline,date:Date.now()/1000 - 86400},
      {rating:baseline,date:Date.now()/1000}
    ];
  }
  const ratings = points.map(point => point.rating);
  const min = Math.floor((Math.min(...ratings) - 60) / 100) * 100;
  const max = Math.ceil((Math.max(...ratings) + 60) / 100) * 100;
  const range = Math.max(100,max-min);
  const coords = points.map((point,index) => [
    32 + index * (278 / (points.length - 1)),
    112 - ((point.rating - min) / range) * 92
  ]);
  const line = coords.map((point,index) => `${index ? 'L' : 'M'}${point[0].toFixed(1)},${point[1].toFixed(1)}`).join(' ');
  const grid = [0,.33,.66,1].map(step => {
    const y = 112 - step * 92;
    const value = Math.round(min + step * range);
    return `<path d="M30 ${y}H314" stroke="rgba(255,255,255,.13)" stroke-width="1"/><text x="0" y="${y+3}" fill="#dceadf" font-size="8">${value}</text>`;
  }).join('');
  const last = coords.at(-1);
  svg.innerHTML = `
    <defs><filter id="lineGlow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    ${grid}
    <path d="${line}" fill="none" stroke="#98ef74" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#lineGlow)"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4" fill="#bfff8f"/>
    <rect x="${last[0]-17}" y="${last[1]-23}" width="34" height="17" rx="4" fill="#fffced"/>
    <text x="${last[0]}" y="${last[1]-11}" fill="#173728" text-anchor="middle" font-size="9" font-weight="800">${ratings.at(-1)}</text>`;
  const formatDate = stamp => new Date(stamp * 1000).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
  if(hasHistory){
    const indexes = [0,Math.floor((points.length-1)/2),points.length-1];
    dates.innerHTML = indexes.map(index => `<span>${formatDate(points[index].date)}</span>`).join('');
  }else{
    dates.innerHTML = '<span class="elo-empty-copy">Joue une partie rapide sur Chess.com pour démarrer la courbe.</span>';
  }
}

function renderProgress(){
  const state = chessComState();
  const username = (state.username || PROGRESS.settings?.chessComUsername || '').toLowerCase();
  const points = ratingHistory(state,username);
  const statRating = Number(state.stats?.chess_rapid?.last?.rating);
  const current = points.at(-1)?.rating || (Number.isFinite(statRating) ? statRating : 1200);
  const first = points[0]?.rating || current;
  const delta = current - first;
  const bracketMin = Math.floor(current / 200) * 200;
  document.getElementById('progress-gem-count').textContent = crownBalance();
  document.getElementById('progress-rank-title').textContent = rankTitle(current);
  document.getElementById('progress-rating').textContent = current;
  document.getElementById('progress-rating-delta').textContent = `${delta >= 0 ? '+' : ''}${delta}`;
  document.getElementById('progress-rank-fill').style.width = `${Math.max(4,Math.min(100,((current - bracketMin) / 200) * 100))}%`;
  document.getElementById('rank-min').textContent = bracketMin;
  document.getElementById('rank-mid').textContent = bracketMin + 100;
  document.getElementById('rank-max').textContent = bracketMin + 200;
  document.getElementById('current-streak').textContent = computeCurrentStreak();
  document.getElementById('best-streak').textContent = computeBestStreak();
  const levelXp = (PROGRESS.xp || 0) % XP_PER_LEVEL;
  document.getElementById('weekly-xp').textContent = levelXp;
  document.getElementById('level-xp-target').textContent = XP_PER_LEVEL;
  document.getElementById('weekly-xp-fill').style.width = `${(levelXp / XP_PER_LEVEL) * 100}%`;
  drawProgressChart(points,current);
}

async function initProgress(){
  renderProgress();
  const username = chessComState().username || PROGRESS.settings?.chessComUsername || '';
  if(!username) return;
  try{
    await fetchChessComStats(username);
    await syncChessCom(username);
    renderProgress();
  }catch(error){
    console.warn(error);
  }
}

initProgress();
</script>
