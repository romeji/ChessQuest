<script src="assets/js/opening-curriculum.js?v=40"></script>

<script src="assets/js/animations.js"></script>

<script src="assets/js/mascot-coach.js?v=44"></script>
<script>
const LOCK_ICON = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const BASE_OPENING_NAMES = {
  najdorf:'Sicilienne — Najdorf', dragon:'Sicilienne — Dragon', sveshnikov:'Sicilienne — Sveshnikov',
  qgd:'Gambit Dame refusé', qga:'Gambit Dame accepté', slav:'Défense Slave',
  italienne:'Italienne — Giuoco Piano', espagnole:'Espagnole — Ruy Lopez', ecossaise:'Partie écossaise',
  gambit_roi:'Gambit Roi', vienne:'Partie Vienne', quatre_cavaliers:'Quatre Cavaliers',
  francaise:'Défense Française', carokann:'Défense Caro-Kann', scandinave:'Défense Scandinave',
  pirc:'Défense Pirc', alekhine:'Défense Alekhine', londres:'Système Londres', colle:'Système Colle',
  indienne_roi:'Défense Est-Indienne', nimzo_indienne:'Défense Nimzo-Indienne',
  grunfeld:'Défense Grünfeld', anglaise:'Ouverture Anglaise', reti:'Ouverture Réti'
};
const query = new URLSearchParams(location.search);
const requestedWorldId = query.get('world') || localStorage.getItem('cq-opening-world');
let currentWorldIndex = Math.max(0, OPENING_WORLDS.findIndex(world => world.id === requestedWorldId));
let activeIsland = null;

function lessonName(key){
  return BASE_OPENING_NAMES[key] || (OPENING_EXTRA_ROWS[key] && OPENING_EXTRA_ROWS[key][0]) || key.replaceAll('_',' ');
}
function isWorldUnlocked(index){
  if(index === 0) return true;
  return curriculumWorldProgress(OPENING_WORLDS[index - 1], PROGRESS.mastered || {}).complete;
}
function isIslandUnlocked(worldIndex, islandIndex){
  if(!isWorldUnlocked(worldIndex)) return false;
  if(islandIndex === 0) return true;
  return curriculumIslandProgress(OPENING_WORLDS[worldIndex].islands[islandIndex - 1], PROGRESS.mastered || {}).complete;
}
function isLessonUnlocked(worldIndex, islandIndex, lessonIndex){
  if(!isIslandUnlocked(worldIndex, islandIndex)) return false;
  const lessons = OPENING_WORLDS[worldIndex].islands[islandIndex].lessons;
  return lessons.slice(0, lessonIndex).every(key => !!(PROGRESS.mastered || {})[key]);
}
function adventureTarget(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem('cq-opening-last') || 'null'); }catch(error){}
  if(saved?.key && !(PROGRESS.mastered || {})[saved.key]){
    const locationData = findCurriculumLesson(saved.key);
    if(locationData && isLessonUnlocked(locationData.worldIndex,locationData.islandIndex,locationData.lessonIndex)){
      return `openings.html?opening=${encodeURIComponent(saved.key)}&world=${encodeURIComponent(locationData.world.id)}&island=${encodeURIComponent(locationData.island.id)}`;
    }
  }
  for(let worldIndex=0;worldIndex<OPENING_WORLDS.length;worldIndex++){
    const world=OPENING_WORLDS[worldIndex];
    for(let islandIndex=0;islandIndex<world.islands.length;islandIndex++){
      const island=world.islands[islandIndex];
      for(let lessonIndex=0;lessonIndex<island.lessons.length;lessonIndex++){
        const key=island.lessons[lessonIndex];
        if(!(PROGRESS.mastered || {})[key] && isLessonUnlocked(worldIndex,islandIndex,lessonIndex)){
          return `openings.html?opening=${encodeURIComponent(key)}&world=${encodeURIComponent(world.id)}&island=${encodeURIComponent(island.id)}`;
        }
      }
    }
  }
  const lastWorld=OPENING_WORLDS[OPENING_WORLDS.length-1];
  const lastIsland=lastWorld.islands[lastWorld.islands.length-1];
  const lastKey=lastIsland.lessons[lastIsland.lessons.length-1];
  return `openings.html?opening=${encodeURIComponent(lastKey)}&world=${encodeURIComponent(lastWorld.id)}&island=${encodeURIComponent(lastIsland.id)}`;
}
function worldRequirement(index){
  if(index === 0) return '';
  return `Termine « ${OPENING_WORLDS[index - 1].shortTitle} » pour ouvrir ce monde.`;
}
function islandRequirement(worldIndex, islandIndex){
  if(!isWorldUnlocked(worldIndex)) return worldRequirement(worldIndex);
  if(islandIndex === 0) return '';
  return `Termine d’abord l’île « ${OPENING_WORLDS[worldIndex].islands[islandIndex - 1].title} ».`;
}
function replaceWorldQuery(){
  const url = new URL(location.href);
  url.searchParams.set('world', OPENING_WORLDS[currentWorldIndex].id);
  url.searchParams.delete('island');
  history.replaceState({},'',url);
  localStorage.setItem('cq-opening-world', OPENING_WORLDS[currentWorldIndex].id);
}
function renderSkillPath(){
  const world = OPENING_WORLDS[currentWorldIndex];
  const mastered = PROGRESS.mastered || {};
  const progress = curriculumWorldProgress(world, mastered);
  const worldUnlocked = isWorldUnlocked(currentWorldIndex);
  const hero = document.querySelector('.teal-hero');
  hero.dataset.worldTheme = world.theme;
  hero.style.setProperty('--opening-map-image', `url("${new URL(world.background, document.baseURI).href}")`);
  hero.classList.toggle('world-locked', !worldUnlocked);

  document.getElementById('world-number').textContent = `Monde ${world.number} / ${OPENING_WORLDS.length}`;
  document.getElementById('world-title').textContent = world.shortTitle;
  document.getElementById('world-progress').textContent = `${progress.completed} / ${progress.total}`;
  document.getElementById('world-prev').disabled = currentWorldIndex === 0;
  document.getElementById('world-next').disabled = currentWorldIndex === OPENING_WORLDS.length - 1;
  document.getElementById('world-chip').classList.toggle('locked', !worldUnlocked);

  const markup = world.islands.map((island, islandIndex) => {
    const position = OPENING_WORLD_POSITIONS[islandIndex];
    const islandProgress = curriculumIslandProgress(island, mastered);
    const unlocked = isIslandUnlocked(currentWorldIndex, islandIndex);
    const complete = islandProgress.complete;
    const status = complete ? 'done' : (unlocked ? 'current' : 'locked');
    const marker = complete ? '✓' : (unlocked ? '▶' : LOCK_ICON);
    const stars = `<span class="island-stars">${islandProgress.completed}/${islandProgress.total} <b>★</b></span>`;
    const content = `<span class="map-hotspot">${marker}</span><span class="map-label">${escapeHtml(island.title)}</span>${stars}`;
    const style = `--top:${position.y}%;--left:${position.x}%;`;
    return `<button class="map-island ${status}" style="${style}" type="button" data-island="${island.id}" aria-label="${escapeHtml(island.title)}, ${islandProgress.completed} leçons sur ${islandProgress.total}${unlocked ? '' : ', verrouillée'}">${content}</button>`;
  }).join('');
  const economy = ensureEconomy();
  const treasureClaimed = !!economy.treasures[world.id];
  const treasureReward = worldTreasureReward(world.number);
  const treasureTitle = treasureClaimed ? 'Trésor collecté' : (progress.complete ? 'Ouvrir le trésor' : (worldUnlocked ? 'Trésor du monde' : 'Monde verrouillé'));
  const treasureCopy = treasureClaimed
    ? `+${treasureReward} couronnes gagnées`
    : (progress.complete ? `Réclame +${treasureReward} couronnes` : (worldUnlocked ? `${progress.completed}/${progress.total} leçons terminées` : worldRequirement(currentWorldIndex)));
  document.getElementById('skill-path').innerHTML = `
    <p class="map-world-subtitle">${escapeHtml(world.subtitle)}</p>
    <div class="map-nodes">${markup}</div>
    ${progress.complete && !treasureClaimed
      ? `<button class="map-treasure-label complete treasure-ready" id="map-world-treasure" type="button"><strong>${escapeHtml(treasureTitle)}</strong><small>${escapeHtml(treasureCopy)}</small></button>`
      : `<div class="map-treasure-label ${progress.complete ? 'complete claimed' : ''}"><strong>${escapeHtml(treasureTitle)}</strong><small>${escapeHtml(treasureCopy)}</small></div>`}`;
  document.querySelectorAll('.map-island').forEach(button => {
    button.addEventListener('click', () => openIsland(button.dataset.island));
  });
  document.getElementById('map-world-treasure')?.addEventListener('click', event => {
    const reward = claimWorldTreasure(world.id, world.number);
    if(!reward.ok) return;
    event.currentTarget.classList.add('reward-burst');
    if(typeof fireConfetti === 'function') fireConfetti('badge');
    showToast('Trésor royal ouvert', `+${reward.amount} couronnes. J'admets que tu les as presque méritées.`);
    setTimeout(renderSkillPath, 520);
  });
}
function renderIslandLessons(world, island, worldIndex, islandIndex){
  const mastered = PROGRESS.mastered || {};
  const islandUnlocked = isIslandUnlocked(worldIndex, islandIndex);
  return island.lessons.map((key, lessonIndex) => {
    const complete = !!mastered[key];
    const unlocked = isLessonUnlocked(worldIndex, islandIndex, lessonIndex);
    const state = complete ? 'complete' : (unlocked ? 'current' : 'locked');
    const status = complete ? 'Maîtrisée' : (unlocked ? 'À apprendre' : 'Verrouillée');
    const icon = complete ? '✓' : (unlocked ? (lessonIndex + 1) : LOCK_ICON);
    const href = `openings.html?opening=${encodeURIComponent(key)}&world=${encodeURIComponent(world.id)}&island=${encodeURIComponent(island.id)}`;
    const inner = `<span class="island-lesson-index">${icon}</span><span class="island-lesson-copy"><strong>${escapeHtml(lessonName(key))}</strong><small>Leçon ${lessonIndex + 1} · ${status}</small></span><span class="island-lesson-arrow">›</span>`;
    return unlocked
      ? `<a class="island-lesson ${state}" href="${href}">${inner}</a>`
      : `<div class="island-lesson locked" aria-disabled="true">${inner}</div>`;
  }).join('');
}
function openIsland(islandId){
  const world = OPENING_WORLDS[currentWorldIndex];
  const islandIndex = world.islands.findIndex(item => item.id === islandId);
  if(islandIndex < 0) return;
  const island = world.islands[islandIndex];
  const progress = curriculumIslandProgress(island, PROGRESS.mastered || {});
  const unlocked = isIslandUnlocked(currentWorldIndex, islandIndex);
  activeIsland = island;
  document.getElementById('island-sheet-kicker').textContent = `MONDE ${world.number} · ÎLE ${islandIndex + 1}`;
  document.getElementById('island-sheet-title').textContent = island.title;
  document.getElementById('island-sheet-copy').textContent = unlocked
    ? 'Apprends les variantes dans l’ordre pour terminer cette île.'
    : islandRequirement(currentWorldIndex, islandIndex);
  document.getElementById('island-sheet-progress-label').textContent = `${progress.completed} / ${progress.total} leçons`;
  document.getElementById('island-sheet-progress-fill').style.width = `${(progress.completed / progress.total) * 100}%`;
  document.getElementById('island-lessons').innerHTML = renderIslandLessons(world, island, currentWorldIndex, islandIndex);
  document.getElementById('island-sheet').hidden = false;
  document.getElementById('map-sheet-backdrop').hidden = false;
  requestAnimationFrame(() => document.body.classList.add('island-sheet-open'));
}
function closeIsland(){
  document.body.classList.remove('island-sheet-open');
  setTimeout(() => {
    document.getElementById('island-sheet').hidden = true;
    document.getElementById('map-sheet-backdrop').hidden = true;
    activeIsland = null;
  }, 220);
}
function changeWorld(delta){
  const next = Math.max(0, Math.min(OPENING_WORLDS.length - 1, currentWorldIndex + delta));
  if(next === currentWorldIndex) return;
  closeIsland();
  currentWorldIndex = next;
  replaceWorldQuery();
  renderSkillPath();
}

document.getElementById('world-prev').onclick = () => changeWorld(-1);
document.getElementById('world-next').onclick = () => changeWorld(1);
document.getElementById('world-chip').onclick = () => {
  const world = OPENING_WORLDS[currentWorldIndex];
  showToast(world.title, isWorldUnlocked(currentWorldIndex) ? world.subtitle : worldRequirement(currentWorldIndex));
};
document.getElementById('island-sheet-close').onclick = closeIsland;
document.getElementById('map-sheet-backdrop').onclick = closeIsland;
document.addEventListener('keydown', event => { if(event.key === 'Escape') closeIsland(); });
const openingMapMenuButton=document.getElementById('opening-map-menu-button');
const openingMapMenuSheet=document.getElementById('opening-map-menu-sheet');
openingMapMenuButton.onclick=()=>{const open=openingMapMenuSheet.classList.toggle('hidden')===false;openingMapMenuButton.setAttribute('aria-expanded',String(open));};
document.getElementById('opening-continue-adventure').href=adventureTarget();

renderSkillPath();
const requestedIsland = query.get('island');
if(requestedIsland && findCurriculumIsland(OPENING_WORLDS[currentWorldIndex].id, requestedIsland)){
  setTimeout(() => openIsland(requestedIsland), 120);
}
</script>
<script src="assets/js/navigation.js?v=70"></script>
</body>
