<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#063c34">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ChessQuest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/chessquest-app-icon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/chessquest-app-icon.png">
<title>ChessQuest — Ouvertures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/reset.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/animations.css">
<link rel="stylesheet" href="assets/css/learn.css">
<link rel="stylesheet" href="assets/css/polish.css">
<link rel="stylesheet" href="assets/css/mockup-pages.css">
</head>
<body data-page="learn" class="opening-map-page">
<div id="toast-container"></div>
<main class="app map-app">
  <section class="page">
    <div class="teal-hero">
      <header class="map-header">
        <a class="subpage-back" aria-label="Retour à l'accueil" href="index.html">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        </a>
        <h1>Ouvertures</h1>
        <span class="quest-currency" id="learn-gem-count">0</span>
      </header>
      <div class="skill-path" id="skill-path" aria-label="Parcours des ouvertures"></div>
    </div>
  </section>
</main>

<script src="assets/js/progress.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/app.js"></script>
<script>
const LOCK_ICON = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

function renderSkillPath(){
  const mastered = PROGRESS.mastered || {};
  const path = [
    {key:'italienne', title:'Italienne', x:43, y:16},
    {key:'gambit_dame', title:'Gambit Dame', x:28, y:38, requires:'italienne'},
    {key:'francaise', title:'Défense Française', x:73, y:43, requires:'najdorf'},
    {key:'najdorf', title:'Sicilienne', x:29, y:62, requires:'gambit_dame'},
    {key:'carokann', title:'Caro-Kann', x:73, y:70, requires:'francaise'},
    {key:'dragon', title:'Ouvertures rares', x:73, y:87, requires:'carokann'}
  ];
  const isComplete = key => key === 'gambit_dame'
    ? ['qgd','qga','slav'].every(line => mastered[line])
    : !!mastered[key];
  const markup = path.map(item => {
    const unlocked = !item.requires || isComplete(item.requires);
    const complete = isComplete(item.key);
    const status = complete ? 'done' : (unlocked ? 'current' : 'locked');
    const marker = complete ? '✓' : (unlocked ? '▶' : LOCK_ICON);
    const stars = complete ? '<span class="island-stars">★ ★ ★</span>' : '';
    const content = `<span class="map-hotspot">${marker}</span><span class="map-label">${escapeHtml(item.title)}</span>${stars}`;
    const style = `--top:${item.y}%;--left:${item.x}%;`;
    const href = item.key === 'gambit_dame'
      ? 'openings.html?path=gambit_dame'
      : `openings.html?opening=${item.key}`;
    return unlocked
      ? `<a class="map-island ${status}" style="${style}" href="${href}" aria-label="${escapeHtml(item.title)}">${content}</a>`
      : `<span class="map-island locked" style="${style}" aria-label="${escapeHtml(item.title)}, verrouillée">${content}</span>`;
  }).join('');
  document.getElementById('skill-path').innerHTML = `
    <div class="map-nodes">${markup}</div>
    <div class="map-treasure-label"><strong>Trésor découvert</strong><small>Collecte 5 ★ pour l’ouvrir !</small></div>`;
  document.getElementById('learn-gem-count').textContent = PROGRESS.xp || 0;
}

renderSkillPath();
</script>
</body>
</html>
