<body>
<main class="secret-hub"><div class="secret-hub-inner">
  <a class="subpage-back secret-back" href="index.html" aria-label="Retour à l’accueil"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span>Retour</span></a>
  <h1 class="secret-title">Les Archives interdites</h1>
  <p class="secret-intro">Trois salles que la mascotte prétend avoir elle-même conçues. Déverrouille leurs clés dans la boutique.</p>
  <div class="secret-levels" id="secret-levels"></div>
</div></main>
<script src="assets/js/progress.js?v=105"></script>
<script src="assets/js/app.js?v=107"></script>
<script src="assets/js/mascot-coach.js?v=44"></script>
<script>
const SECRET_LEVELS = [
  {id:'secret-tactics',icon:'⚔️',title:'Le Cabinet des fourchettes',text:'Fourchettes, enfilades et attaques doubles.',href:'puzzles.html?theme=Fourchette&secret=secret-tactics'},
  {id:'secret-endgame',icon:'🏰',title:'La Crypte des finales',text:'Mats à l’échelle et finales sans droit à l’erreur.',href:'puzzles.html?theme=Mat à l’échelle&secret=secret-endgame'},
  {id:'secret-crown',icon:'👑',title:'Le Défi de la Couronne',text:'Une sélection aléatoire au niveau maximal.',href:'puzzles.html?source=random&secret=secret-crown'}
];
document.getElementById('secret-levels').innerHTML = SECRET_LEVELS.map(level => {
  const open=isSecretUnlocked(level.id);
  return `<a class="secret-level ${open?'':'locked'}" href="${open?level.href:'#'}" data-secret="${level.id}" aria-disabled="${!open}">
    <span class="secret-level-icon">${open?level.icon:'🔒'}</span><span><h2>${escapeHtml(level.title)}</h2><p>${escapeHtml(level.text)}</p></span><span class="secret-state">${open?'›':'🔐'}</span>
  </a>`;
}).join('');
document.querySelectorAll('.secret-level.locked').forEach(card => card.onclick = event => {
  event.preventDefault(); showMascotReaction('locked','La clé se trouve dans la boutique royale.',{toast:true});
});
</script>
<nav class="tabbar" aria-label="Navigation principale"></nav>
