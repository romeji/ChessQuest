<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#064b39">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">

<title>ChessQuest — Académie</title>
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/reset.css">
<link rel="stylesheet" href="assets/css/components.css?v=104">
<link rel="stylesheet" href="assets/css/gamification.css?v=50">
<link rel="stylesheet" href="assets/css/ux-refinement.css?v=107">
<link rel="stylesheet" href="assets/css/navigation.css?v=101" data-quest-navigation>
<link rel="stylesheet" href="assets/css/navigation-stability-v101.css">

<script defer src="assets/js/navigation.js?v=107"></script>

<body class="academy-page">
<main class="academy-shell">
  <div class="cq-lessons-top">
    <a class="back-btn" href="learn.html" aria-label="Retour">←</a>
    <h1>Leçons</h1>
  </div>

  <a class="cq-next-lesson" id="academy-next-lesson" href="course.html">
    <div class="thumb">♟</div>
    <div class="body">
      <div class="eyebrow">Leçon suivante</div>
      <div class="title" id="academy-next-title">Développez vos pièces</div>
      <div class="sub" id="academy-total-progress"></div>
    </div>
    <div class="go">▶</div>
  </a>

  <div class="cq-lessons-tabs">
    <button class="active" type="button" data-tab="category">Catégorie</button>
    <button type="button" data-tab="level">Niveau</button>
    <button type="button" data-tab="instructor">Instructeur</button>
  </div>

  <nav class="cq-lessons-levels" aria-label="Niveaux de cours">
    <button class="active" data-level="0">0–300</button><button data-level="300">300–700</button><button data-level="700">700–1200</button><button data-level="1200">1200–1800</button><button data-level="1800">1800+</button>
  </nav>

  <a class="cq-featured-course" id="academy-featured-course" href="course.html">
    <h2 id="academy-featured-title">Le mouvement des pièces</h2>
    <div class="arrow-fab">→</div>
  </a>
  <p class="cq-featured-meta"><b id="academy-featured-title2">Le mouvement des pièces</b><br>ChessQuest Team · 🎓 <span id="academy-featured-count">13</span> leçons</p>

  <section id="academy-courses" class="cq-lessons-list"></section>

  <section id="openings" class="academy-opening-library" style="margin-top:26px;">
    <h2>Bibliothèque des ouvertures</h2>
    <p>Choisis une famille pour comprendre son histoire, ses idées et ses pièges avant de mémoriser les coups.</p>
    <div id="academy-openings"></div>
  </section>
</main>
<script src="assets/js/progress.js?v=105"></script>
<script src="assets/js/app.js?v=107"></script>
<script src="assets/js/openings.js"></script>
<script src="assets/js/courses.js?v=50"></script>
<script>
function renderCourses(level){
  const courses=writtenCoursesForLevel(level);
  document.getElementById('academy-courses').innerHTML=courses.map((course,index)=>{
    const complete=(PROGRESS.completedCourses||[]).includes(course.id);
    return `<a class="${complete?'complete':''}" href="course.html?id=${encodeURIComponent(course.id)}"><span class="ic">${escapeHtml(course.icon||String(index+1))}</span><div class="body"><div class="title">${escapeHtml(course.title)}</div><div class="sub">${escapeHtml(course.summary)} · ${escapeHtml(course.duration)} · +20 XP</div></div><b>${complete?'✓':'›'}</b></a>`;
  }).join('');
  const first = courses.find(course => !(PROGRESS.completedCourses||[]).includes(course.id)) || courses[0];
  if(first){
    document.getElementById('academy-featured-title').textContent = first.title;
    document.getElementById('academy-featured-title2').textContent = first.title;
    document.getElementById('academy-featured-count').textContent = courses.length;
    document.getElementById('academy-featured-course').href = `course.html?id=${encodeURIComponent(first.id)}`;
    document.getElementById('academy-next-title').textContent = first.title;
    document.getElementById('academy-next-lesson').href = `course.html?id=${encodeURIComponent(first.id)}`;
  }
}
document.querySelectorAll('.cq-lessons-levels [data-level]').forEach(button=>button.onclick=()=>{
  document.querySelectorAll('.cq-lessons-levels [data-level]').forEach(item=>item.classList.remove('active'));
  button.classList.add('active');renderCourses(Number(button.dataset.level));
});
document.querySelectorAll('.cq-lessons-tabs button').forEach(tab=>tab.onclick=()=>{
  document.querySelectorAll('.cq-lessons-tabs button').forEach(item=>item.classList.remove('active'));
  tab.classList.add('active');
});
const completedCount=(PROGRESS.completedCourses||[]).filter(id=>writtenCourseById(id)).length;
document.getElementById('academy-total-progress').textContent=`✓ ${completedCount} cours maîtrisé${completedCount>1?'s':''} sur ${WRITTEN_COURSES.length}`;
function recommendedAcademyLevel(){
  const state=PROGRESS.chessCom||{};
  const rapid=Number(state.stats?.chess_rapid?.last?.rating);
  const games=Array.isArray(state.games)?state.games:[];
  const username=String(state.username||PROGRESS.settings?.chessComUsername||'').toLowerCase();
  const latest=games.map(game=>String(game.white?.username||'').toLowerCase()===username?Number(game.white?.rating):Number(game.black?.rating)).find(Number.isFinite);
  const elo=Number.isFinite(rapid)?rapid:(Number.isFinite(latest)?latest:0);
  if(elo>=1800)return 1800;if(elo>=1200)return 1200;if(elo>=700)return 700;if(elo>=300)return 300;return 0;
}
const initialLevel=recommendedAcademyLevel();
document.querySelectorAll('.cq-lessons-levels [data-level]').forEach(button=>button.classList.toggle('active',Number(button.dataset.level)===initialLevel));
renderCourses(initialLevel);
const featured=['italienne','espagnole','qgd','qga','slav','najdorf','carokann','francaise'].filter(key=>OPENINGS[key]);
document.getElementById('academy-openings').innerHTML=featured.map(key=>`<a href="openings.html?opening=${encodeURIComponent(key)}"><strong>${escapeHtml(OPENINGS[key].name)}</strong><small>${escapeHtml(OPENINGS[key].intro||'Comprendre les idées de cette ouverture.')}</small><span>Lire et pratiquer ›</span></a>`).join('');
</script>
<nav class="tabbar" aria-label="Navigation principale"></nav>
</body>
</html>
